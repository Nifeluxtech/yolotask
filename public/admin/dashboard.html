<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    @media (max-width: 768px) { .sidebar { display: none; } .admin-layout { flex-direction: column; } }
    .sidebar a { color: var(--text-secondary); text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 500; }
    .sidebar a.active, .sidebar a:hover { background: var(--accent-glow); color: var(--accent); }
    .main { flex: 1; padding: 30px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--bg-secondary); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .stat-val { font-size: 32px; font-weight: 800; color: var(--accent); margin: 10px 0; }
    .stat-lbl { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div style="font-size:20px; font-weight:800; color:var(--accent); margin-bottom:20px;">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html" class="active">Dashboard</a>
      <a href="/admin/campaigns.html">Campaign Reviews</a>
      <a href="/admin/withdrawals.html">Withdrawals</a>
      <a href="/admin/users.html">Users</a>
      <a href="/admin/announcements.html">Announcements</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" style="margin-top:auto; color:var(--error);">Logout</a>
    </aside>
    <main class="main">
      <h1 style="margin-bottom: 30px;">Platform Overview</h1>
      <div class="stats-grid" id="statsGrid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;

      try {
        const res = await apiClient.request('admin.js', { action: 'get_dashboard_stats' });
        const s = res.data.stats;
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="stat-lbl">Active Campaigns</div><div class="stat-val">${s.active_campaigns}</div></div>
          <div class="stat-card"><div class="stat-lbl">Pending Submissions</div><div class="stat-val">${s.pending_submissions}</div></div>
          <div class="stat-card"><div class="stat-lbl">Pending Withdrawals</div><div class="stat-val" style="color:var(--warning);">${s.pending_withdrawals}</div></div>
          <div class="stat-card"><div class="stat-lbl">Platform Revenue</div><div class="stat-val" style="color:var(--success);">${formatCurrency(s.platform_revenue)}</div></div>
        `;
      } catch (err) { showToast('Failed to load stats', 'error'); }
    })();
  </script>
</body>
</html>
