<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { 
      width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); 
      padding: 20px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
    }
    .sidebar a { 
      color: var(--text-secondary); text-decoration: none; padding: 12px 15px; 
      border-radius: 8px; font-weight: 500; transition: all 0.2s; 
    }
    .sidebar a.active, .sidebar a:hover { background: var(--accent-glow); color: var(--accent); }
    
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    
    /* Mobile adjustments */
    @media (max-width: 768px) { 
      .sidebar { display: none; } 
      .main-content { padding: 20px; } 
    }

    .stats-grid { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
      gap: 20px; margin-bottom: 40px; 
    }
    .stat-card { 
      background: var(--bg-secondary); padding: 25px; border-radius: var(--radius-lg); 
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .stat-val { font-size: 32px; font-weight: 800; color: var(--accent); margin: 10px 0; }
    .stat-lbl { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

    .quick-actions { margin-top: 20px; }
    .actions-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .action-btn {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 20px; text-align: center; text-decoration: none; color: var(--text-primary);
      transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .action-btn:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-2px); }
    .action-icon { font-size: 24px; }
    .action-text { font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div style="font-size:20px; font-weight:800; color:var(--accent); margin-bottom:30px; padding: 0 15px;">
        YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span>
      </div>
      <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
      <a href="/admin/campaigns.html"> Campaign Reviews</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html"> Announcements</a>
      <a href="/login.html" onclick="localStorage.clear()" style="margin-top:auto; color:var(--error);"> Logout</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
        <h1>Platform Overview</h1>
        <div style="font-size:14px; color:var(--text-secondary);">Welcome, <span id="adminName" style="color:var(--text-primary); font-weight:600;">Admin</span></div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid" id="statsGrid">
        <div class="skeleton skeleton-card" style="height: 120px;"></div>
        <div class="skeleton skeleton-card" style="height: 120px;"></div>
        <div class="skeleton skeleton-card" style="height: 120px;"></div>
        <div class="skeleton skeleton-card" style="height: 120px;"></div>
      </div>

      <!-- Quick Actions (Great for Mobile) -->
      <div class="quick-actions">
        <h2 style="margin-bottom: 15px; font-size: 18px;">Quick Actions</h2>
        <div class="actions-grid">
          <a href="/admin/campaigns.html" class="action-btn">
            <div class="action-icon">📝</div>
            <div class="action-text">Review Campaigns</div>
          </a>
          <a href="/admin/withdrawals.html" class="action-btn">
            <div class="action-icon">💸</div>
            <div class="action-text">Process Withdrawals</div>
          </a>
          <a href="/admin/users.html" class="action-btn">
            <div class="action-icon">👥</div>
            <div class="action-text">Manage Users</div>
          </a>
          <a href="/admin/announcements.html" class="action-btn">
            <div class="action-icon"></div>
            <div class="action-text">Post Announcement</div>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      
      document.getElementById('adminName').textContent = profile.full_name;

      try {
        const res = await apiClient.request('admin.js', { action: 'get_dashboard_stats' });
        const s = res.data.stats;
        
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card">
            <div class="stat-lbl">Active Campaigns</div>
            <div class="stat-val">${s.active_campaigns || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Pending Submissions</div>
            <div class="stat-val" style="color: var(--warning);">${s.pending_submissions || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Pending Withdrawals</div>
            <div class="stat-val" style="color: var(--error);">${s.pending_withdrawals || 0}</div>
          </div>
          <div class="stat-card">
            <div class="stat-lbl">Platform Revenue</div>
            <div class="stat-val" style="color: var(--success); font-size: 24px;">${formatCurrency(s.platform_revenue)}</div>
          </div>
        `;
      } catch (err) { 
        console.error("DASHBOARD STATS ERROR:", err);
        showToast('Failed to load stats. Check console.', 'error'); 
        document.getElementById('statsGrid').innerHTML = '<div class="stat-card" style="grid-column: 1/-1; text-align:center; color:var(--error);">Failed to load dashboard data.</div>';
      }
    })();
  </script>
</body>
</html>
