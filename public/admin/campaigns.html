<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Reviews - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html" class="active">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Campaign Reviews</div>
        <span class="badge cyan" id="countBadge">0 pending</span>
      </header>

      <div id="list"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('admin.js', { action: 'get_campaigns_for_review' });
        const camps = res.data.campaigns || [];
        document.getElementById('countBadge').textContent = camps.length + ' pending';
        const box = document.getElementById('list');

        if (camps.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No campaigns awaiting review. 🎉</div>';
          return;
        }

        box.innerHTML = camps.map(c => `
          <div class="panel" id="camp-${c.id}">
            <div class="row-item" style="border:none; padding:0 0 10px;">
              <div>
                <div style="font-weight:700; font-size:15px;">${escapeHtml(c.title)}</div>
                <div class="row-sub">${escapeHtml(c.advertiser?.full_name || 'Unknown')} • ${escapeHtml(c.task_types?.name || 'Task')} • ${c.completed_quantity}/${c.target_quantity} workers</div>
              </div>
              <span class="badge amber">${formatCurrency(c.total_budget)}</span>
            </div>
            <div style="font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:14px; white-space:pre-wrap;">${escapeHtml(c.instructions || '').slice(0, 300)}</div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
              <button class="btn btn-danger" style="padding:8px 16px; font-size:12px;" onclick="review('${c.id}','REJECTED')">Reject</button>
              <button class="btn btn-success" style="padding:8px 16px; font-size:12px;" onclick="review('${c.id}','APPROVED')">Approve & Go Live</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.review = async function (campaignId, reviewAction) {
      const note = reviewAction === 'REJECTED' ? (prompt('Reason for rejection (sent to advertiser):') || '') : '';
      if (reviewAction === 'REJECTED' && note === null) return;
      if (!confirm(`${reviewAction === 'APPROVED' ? 'Approve and set LIVE?' : 'Reject this campaign?'}`)) return;

      try {
        await apiClient.request('admin.js', { action: 'review_campaign', campaignId, reviewAction, adminNote: note });
        showToast(`Campaign ${reviewAction.toLowerCase()}.`, 'success');
        document.getElementById(`camp-${campaignId}`)?.remove();
      } catch (err) { showToast(err.message, 'error'); }
    };
  </script>
</body>
</html>
