<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Reviews - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .campaign-card { overflow: hidden; }
    .campaign-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin: 16px 0; }
    .meta-item { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .meta-label { display: block; color: var(--text-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: .45px; margin-bottom: 4px; }
    .meta-value { display: block; color: var(--text-primary); font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .detail-block { margin-top: 14px; }
    .detail-label { color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .45px; margin-bottom: 5px; }
    .detail-text { color: var(--text-primary); font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .action-row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--border); }
    .empty-state { text-align: center; color: var(--text-secondary); padding: 44px 20px; }
    .error-state { color: var(--error); }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/gateway.html">🔀 Gateways</a>
      <a href="/admin/sms.html">📱 SMS Control</a>
      <a href="/admin/catalog.html">🧩 Catalog</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html" class="active">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div>
          <div class="page-title">Campaign Reviews</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Review submitted advertiser campaigns before they go live.</div>
        </div>
        <span class="badge cyan" id="countBadge">0</span>
      </header>

      <div id="campaignList">
        <div class="panel"><div class="skeleton skeleton-card"></div></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      await loadCampaigns();
    })();

    function displayValue(value, fallback = '—') {
      return value === null || value === undefined || value === '' ? fallback : String(value);
    }

    function formatAmount(value) {
      const amount = Number(value);
      return Number.isFinite(amount) ? formatCurrency(amount) : '—';
    }

    function renderDetail(label, value) {
      if (value === null || value === undefined || String(value).trim() === '') return '';
      return `<div class="detail-block"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-text">${escapeHtml(value)}</div></div>`;
    }

    function renderCampaign(campaign) {
      const advertiser = campaign.advertiser?.full_name || campaign.advertiser?.business_name || 'Unknown advertiser';
      const taskType = campaign.task_types?.name || 'Unknown task type';
      const targetQuantity = campaign.target_quantity ?? campaign.worker_count;
      const submittedAt = campaign.created_at ? formatDate(campaign.created_at) : '—';
      const targeted = campaign.is_targeted ? 'Targeted' : 'Standard';

      return `
        <article class="panel campaign-card" id="campaign-${escapeHtml(campaign.id)}">
          <div class="row-item" style="border:none; padding:0; align-items:flex-start;">
            <div style="flex:1; min-width:220px;">
              <div style="font-weight:800; font-size:16px;">${escapeHtml(displayValue(campaign.title, 'Untitled campaign'))}</div>
              <div class="row-sub">Advertiser: ${escapeHtml(advertiser)} • Submitted ${escapeHtml(submittedAt)}</div>
            </div>
            <span class="badge amber">SUBMITTED</span>
          </div>

          <div class="campaign-meta">
            <div class="meta-item"><span class="meta-label">Task type</span><span class="meta-value">${escapeHtml(taskType)}</span></div>
            <div class="meta-item"><span class="meta-label">Budget</span><span class="meta-value">${escapeHtml(formatAmount(campaign.total_budget))}</span></div>
            <div class="meta-item"><span class="meta-label">Workers</span><span class="meta-value">${escapeHtml(displayValue(targetQuantity))}</span></div>
            <div class="meta-item"><span class="meta-label">Targeting</span><span class="meta-value">${escapeHtml(targeted)}</span></div>
            <div class="meta-item"><span class="meta-label">Start date</span><span class="meta-value">${escapeHtml(campaign.start_date ? formatDate(campaign.start_date) : 'Immediate')}</span></div>
            <div class="meta-item"><span class="meta-label">End date</span><span class="meta-value">${escapeHtml(campaign.end_date ? formatDate(campaign.end_date) : 'No end date')}</span></div>
          </div>

          ${renderDetail('Description', campaign.description)}
          ${renderDetail('Instructions', campaign.instructions)}
          ${renderDetail('Proof requirements', campaign.proof_requirements)}
          ${campaign.destination_link ? `<div class="detail-block"><div class="detail-label">Destination link</div><a class="detail-text" href="${escapeHtml(campaign.destination_link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(campaign.destination_link)}</a></div>` : ''}

          <div class="action-row">
            <button class="btn btn-danger" style="padding:9px 16px; font-size:12px;" onclick="reviewCampaign('${escapeHtml(campaign.id)}', 'REJECTED')">Reject</button>
            <button class="btn btn-success" style="padding:9px 16px; font-size:12px;" onclick="reviewCampaign('${escapeHtml(campaign.id)}', 'APPROVED')">Approve &amp; Publish</button>
          </div>
        </article>`;
    }

    async function loadCampaigns() {
      const box = document.getElementById('campaignList');
      try {
        const response = await apiClient.request('admin.js', { action: 'get_campaigns_for_review' });
        const campaigns = response.data?.campaigns || [];
        document.getElementById('countBadge').textContent = campaigns.length;

        if (campaigns.length === 0) {
          box.innerHTML = '<div class="panel empty-state">No campaigns are waiting for review.</div>';
          return;
        }

        box.innerHTML = campaigns.map(renderCampaign).join('');
      } catch (error) {
        box.innerHTML = `<div class="panel empty-state error-state">${escapeHtml(error.message || 'Could not load campaigns.')}</div>`;
      }
    }

    window.reviewCampaign = async function (campaignId, reviewAction) {
      const isApproval = reviewAction === 'APPROVED';
      const promptText = isApproval
        ? 'Optional approval note:'
        : 'Optional rejection reason:';
      const adminNote = window.prompt(promptText, '');
      if (adminNote === null) return;

      const confirmation = isApproval
        ? 'Approve this campaign and make it live?'
        : 'Reject this campaign?';
      if (!window.confirm(confirmation)) return;

      const card = document.getElementById(`campaign-${campaignId}`);
      const buttons = card ? card.querySelectorAll('button') : [];
      buttons.forEach(button => { button.disabled = true; });

      try {
        await apiClient.request('admin.js', {
          action: 'review_campaign',
          campaignId,
          reviewAction,
          adminNote: adminNote.trim()
        });
        showToast(`Campaign ${reviewAction.toLowerCase()}.`, 'success');
        card?.remove();
        const remaining = document.querySelectorAll('.campaign-card').length;
        document.getElementById('countBadge').textContent = remaining;
        if (remaining === 0) {
          document.getElementById('campaignList').innerHTML = '<div class="panel empty-state">No campaigns are waiting for review.</div>';
        }
      } catch (error) {
        buttons.forEach(button => { button.disabled = false; });
        showToast(error.message || 'Campaign review failed.', 'error');
      }
    };
  </script>
</body>
</html>
