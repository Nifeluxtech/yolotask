<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Campaigns - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header class="app-header">
    <a href="/admin/dashboard.html" class="header-logo">YOLOTASK <span style="font-size:12px; color:var(--error); font-weight:700;">ADMIN</span></a>
    <div class="header-user"><span id="adminName">Admin</span></div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="/admin/campaigns.html" class="sidebar-link active">Campaign Reviews</a>
      <a href="/admin/users.html" class="sidebar-link">Users</a>
      <a href="/admin/withdrawals.html" class="sidebar-link">Withdrawals</a>
      <a href="/admin/settings.html" class="sidebar-link">Settings</a>
    </aside>

    <main class="admin-content">
      <h1 style="margin-bottom:20px;">Campaign Review Queue</h1>
      <p style="color:var(--text-secondary); margin-bottom:30px;">Review submitted campaigns. Approving will lock the advertiser's funds and publish the task.</p>
      
      <div id="campaignQueue">
        <div style="color:var(--text-secondary);">Loading queue...</div>
      </div>
    </main>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal-overlay" style="display:none;">
    <div class="modal-content" id="modalBody">
      <!-- Populated by JS -->
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      document.getElementById('adminName').textContent = profile.full_name;

      const queue = document.getElementById('campaignQueue');
      try {
        const res = await apiClient.request('admin.js', { action: 'get_campaigns_for_review' });
        const campaigns = res.data.campaigns;

        if (campaigns.length === 0) {
          queue.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:40px;">No campaigns pending review.</div>';
          return;
        }

        queue.innerHTML = `
          <table class="data-table">
            <thead>
              <tr>
                <th>Campaign</th>
                <th>Advertiser</th>
                <th>Type</th>
                <th>Budget</th>
                <th>Workers</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${campaigns.map(c => `
                <tr>
                  <td data-label="Campaign">${c.title}</td>
                  <td data-label="Advertiser">${c.advertiser.full_name}</td>
                  <td data-label="Type">${c.task_types.name} ${c.is_targeted ? '(Premium)' : ''}</td>
                  <td data-label="Budget">₦${c.total_budget.toLocaleString()}</td>
                  <td data-label="Workers">${c.target_quantity}</td>
                  <td data-label="Actions">
                    <button class="btn-sm btn-info" onclick="viewDetails('${c.id}')">View</button>
                    <button class="btn-sm btn-approve" onclick="reviewCampaign('${c.id}', 'APPROVED')">Approve</button>
                    <button class="btn-sm btn-reject" onclick="reviewCampaign('${c.id}', 'REJECTED')">Reject</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        queue.innerHTML = `<div style="color:var(--error);">Error: ${err.message}</div>`;
      }
    })();

    async function viewDetails(campaignId) {
      // In a full implementation, fetch specific campaign details. 
      // For MVP, we'll just alert or show a basic modal.
      alert("Detailed view modal would open here showing instructions, targeting, and proof requirements.");
    }

    async function reviewCampaign(campaignId, action) {
      const note = prompt(`Enter admin note for ${action} (optional):`);
      if (action === 'APPROVED' && !confirm('Approve and lock funds for this campaign?')) return;
      if (action === 'REJECTED' && !confirm('Reject this campaign?')) return;

      try {
        await apiClient.request('admin.js', { action: 'review_campaign', campaignId, reviewAction: action, adminNote: note });
        alert(`Campaign ${action.toLowerCase()} successfully.`);
        window.location.reload();
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
