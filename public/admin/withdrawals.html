<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdrawals - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/sms.html">📱 SMS Control</a>
      <a href="/admin/catalog.html">🧩 Catalog</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html" class="active">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Withdrawals</div>
        <span class="badge cyan" id="countBadge">0</span>
      </header>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">
        Send the transfer from your bank/Paystack first, then mark it paid here. Full account details are shown for processing.
      </p>

      <div id="list"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('admin.js', { action: 'get_withdrawals' });
        const wds = res.data.withdrawals || [];
        document.getElementById('countBadge').textContent = wds.filter(w => w.status === 'PENDING').length + ' pending';
        const box = document.getElementById('list');

        if (wds.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No withdrawal requests yet.</div>';
          return;
        }

        box.innerHTML = wds.map(w => `
          <div class="panel" id="wd-${w.id}">
            <div class="row-item" style="border:none; padding:0 0 10px;">
              <div style="flex:1; min-width:0;">
                <div style="font-weight:700; font-size:15px;">${escapeHtml(w.profiles?.full_name || 'Unknown')} — ${formatCurrency(w.amount)}</div>
                <div class="row-sub">${escapeHtml(w.bank_name)} • ${escapeHtml(w.account_name)} • ${formatDate(w.created_at)}</div>
                <div style="display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;">
                  <code style="background:var(--bg-primary); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:14px; letter-spacing:1px; color:var(--text-primary);">${escapeHtml(String(w.account_number))}</code>
                  <button class="btn btn-outline" style="padding:5px 10px; font-size:11px;" onclick="copyAcct('${escapeHtml(String(w.account_number))}')">Copy</button>
                </div>
              </div>
              <span class="badge ${w.status === 'PENDING' ? 'amber' : w.status === 'COMPLETED' ? 'green' : 'red'}">${w.status}</span>
            </div>
            ${w.status === 'PENDING' ? `
              <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px;">
                <button class="btn btn-danger" style="padding:8px 16px; font-size:12px;" onclick="proc('${w.id}','REJECTED',this)">Reject & Refund</button>
                <button class="btn btn-success" style="padding:8px 16px; font-size:12px;" onclick="proc('${w.id}','COMPLETED',this)">Mark Paid</button>
              </div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.copyAcct = function (num) {
      navigator.clipboard?.writeText(num)
        .then(() => showToast('Account number copied.', 'success'))
        .catch(() => showToast(num, 'warning'));
    };

    window.proc = async function (withdrawalId, wdAction, btn) {
      const label = wdAction === 'COMPLETED' ? 'Mark as PAID? Only do this after sending the real transfer.' : 'Reject and return funds to the user wallet?';
      if (!confirm(label)) return;

      const old = btn.textContent;
      btn.disabled = true; btn.textContent = 'Processing...';
      try {
        // FIXED: decision sent as wdAction (no more duplicate `action` key)
        const res = await apiClient.request('admin.js', { action: 'process_withdrawal', withdrawalId, wdAction });
        showToast(res.message || 'Withdrawal updated.', 'success');
        setTimeout(() => load(), 600);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = old;
      }
    };
  </script>
</body>
</html>
