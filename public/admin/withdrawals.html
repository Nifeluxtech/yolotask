<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Withdrawals - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html" class="active">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Withdrawals</div>
        <span class="badge cyan" id="countBadge">0</span>
      </header>

      <div id="list"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('admin.js', { action: 'get_withdrawals' });
        const wds = res.data.withdrawals || [];
        document.getElementById('countBadge').textContent = wds.filter(w => w.status === 'PENDING').length + ' pending';
        const box = document.getElementById('list');

        if (wds.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No withdrawal requests yet.</div>';
          return;
        }

        box.innerHTML = wds.map(w => `
          <div class="panel" id="wd-${w.id}">
            <div class="row-item" style="border:none; padding:0;">
              <div>
                <div style="font-weight:700; font-size:15px;">${escapeHtml(w.profiles?.full_name || 'Unknown')} — ${formatCurrency(w.amount)}</div>
                <div class="row-sub">${escapeHtml(w.bank_name)} • ****${escapeHtml(String(w.account_number).slice(-4))} • ${escapeHtml(w.account_name)} • ${formatDate(w.created_at)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span class="badge ${w.status === 'PENDING' ? 'amber' : w.status === 'COMPLETED' ? 'green' : 'red'}">${w.status}</span>
                ${w.status === 'PENDING' ? `
                  <button class="btn btn-danger" style="padding:7px 12px; font-size:11px;" onclick="proc('${w.id}','REJECTED')">Reject</button>
                  <button class="btn btn-success" style="padding:7px 12px; font-size:11px;" onclick="proc('${w.id}','COMPLETED')">Mark Paid</button>
                ` : ''}
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.proc = async function (withdrawalId, action) {
      if (!confirm(action === 'COMPLETED' ? 'Confirm you have sent this payment via your bank/Paystack transfer.' : 'Reject and return funds to user wallet?')) return;
      try {
        await apiClient.request('admin.js', { action: 'process_withdrawal', withdrawalId, action });
        showToast('Withdrawal updated.', 'success');
        load();
      } catch (err) { showToast(err.message, 'error'); }
    };
  </script>
</body>
</html>
