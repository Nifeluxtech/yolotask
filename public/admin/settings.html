<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Settings - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html" class="active">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Platform Settings</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:13px; color:var(--text-secondary);" id="adminName"></span>
          <button class="btn btn-danger" style="padding:7px 14px; font-size:12px;" id="headerLogoutBtn">Logout</button>
        </div>
      </header>

      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:18px;">Changes go live immediately across the entire platform.</p>

      <div id="settingsArea"><div class="panel">Loading settings...</div></div>

      <!-- SESSION PANEL -->
      <div class="panel" style="border-color: var(--error);">
        <h3 style="color:var(--error);">Session</h3>
        <p style="font-size:13px; color:var(--text-secondary); margin-bottom:14px;">Sign out of this admin session on this device.</p>
        <button class="btn btn-danger w-full" id="sessionLogoutBtn">🚪 Logout of Admin</button>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    function adminLogout() {
      if (!confirm('Logout of the admin panel?')) return;
      localStorage.clear();
      window.location.href = '/login.html';
    }

    document.getElementById('headerLogoutBtn').addEventListener('click', adminLogout);
    document.getElementById('sessionLogoutBtn').addEventListener('click', adminLogout);

    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      document.getElementById('adminName').textContent = profile.full_name;

      try {
        const res = await apiClient.request('admin.js', { action: 'get_platform_settings' });
        const s = res.data.settings;

        document.getElementById('settingsArea').innerHTML = `
          <div class="panel">
            <h3 style="color:var(--error);">Platform Control</h3>
            <div class="toggle-row">
              <div>
                <div style="font-weight:600; font-size:14px;">Maintenance Mode</div>
                <div style="font-size:12px; color:var(--text-secondary);">Blocks ALL users except admins.</div>
              </div>
              <label class="switch red"><input type="checkbox" id="maintenance_mode" ${s.maintenance_mode === true || s.maintenance_mode === 'true' ? 'checked' : ''} /><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
              <div>
                <div style="font-weight:600; font-size:14px;">Registrations Open</div>
                <div style="font-size:12px; color:var(--text-secondary);">Turn OFF to block new sign-ups.</div>
              </div>
              <label class="switch green"><input type="checkbox" id="registrations_open" ${s.registrations_open === false || s.registrations_open === 'false' ? '' : 'checked'} /><span class="slider"></span></label>
            </div>
          </div>

          <div class="panel">
            <h3>Money Settings (₦)</h3>
            <label class="f-label">Daily Check-in Reward</label>
            <input type="number" id="daily_checkin_reward" class="f-input" min="0" value="${s.daily_checkin_reward ?? 10}" />
            <label class="f-label">Minimum Withdrawal</label>
            <input type="number" id="min_withdrawal_amount" class="f-input" min="100" value="${s.min_withdrawal_amount ?? 1000}" />
            <label class="f-label">Referral Reward (Earner, ₦)</label>
            <input type="number" id="referral_reward_earner" class="f-input" min="0" value="${s.referral_reward_earner ?? 150}" />
            <label class="f-label">Referral Reward (Advertiser, % of first top-up, 0–1)</label>
            <input type="number" id="referral_reward_advertiser_pct" class="f-input" min="0" max="1" step="0.01" value="${s.referral_reward_advertiser_pct ?? 0.05}" />
          </div>

          <button class="btn btn-primary w-full" id="saveBtn" style="margin-bottom:18px;">Save All Settings</button>
        `;

        document.getElementById('saveBtn').addEventListener('click', async () => {
          const btn = document.getElementById('saveBtn');
          const maintenanceOn = document.getElementById('maintenance_mode').checked;
          if (maintenanceOn && !confirm('ENABLE MAINTENANCE MODE? All non-admin users will be locked out immediately.')) return;

          btn.disabled = true; btn.textContent = 'Saving...';
          try {
            await apiClient.request('admin.js', {
              action: 'update_platform_settings',
              settings: {
                maintenance_mode: maintenanceOn,
                registrations_open: document.getElementById('registrations_open').checked,
                daily_checkin_reward: Number(document.getElementById('daily_checkin_reward').value),
                min_withdrawal_amount: Number(document.getElementById('min_withdrawal_amount').value),
                referral_reward_earner: Number(document.getElementById('referral_reward_earner').value),
                referral_reward_advertiser_pct: Number(document.getElementById('referral_reward_advertiser_pct').value)
              }
            });
            showToast('Settings saved. Changes are live.', 'success');
          } catch (err) { showToast(err.message, 'error'); }
          btn.disabled = false; btn.textContent = 'Save All Settings';
        });
      } catch (err) {
        document.getElementById('settingsArea').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
