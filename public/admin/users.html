<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html" class="active">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">User Management</div>
        <span class="badge cyan" id="countBadge">0</span>
      </header>

      <div class="panel">
        <div class="table-wrap" id="tableWrap"><div class="skeleton skeleton-card"></div></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('admin.js', { action: 'get_users' });
        const users = res.data.users || [];
        document.getElementById('countBadge').textContent = users.length + ' users';

        document.getElementById('tableWrap').innerHTML = `
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Joined</th><th style="text-align:right;">Action</th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td style="font-weight:600;">${escapeHtml(u.full_name || 'Unknown')}</td>
                  <td><span class="badge cyan">${u.role}</span></td>
                  <td><span class="badge ${u.is_suspended ? 'red' : 'green'}">${u.is_suspended ? 'Suspended' : 'Active'}</span></td>
                  <td style="color:var(--text-secondary); font-size:12px;">${formatDate(u.created_at)}</td>
                  <td style="text-align:right;">
                    <button class="btn ${u.is_suspended ? 'btn-success' : 'btn-danger'}" style="padding:6px 12px; font-size:11px;"
                      onclick="toggle('${u.id}', ${!u.is_suspended})">
                      ${u.is_suspended ? 'Unsuspend' : 'Suspend'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        document.getElementById('tableWrap').innerHTML = `<div style="color:var(--error); padding:20px;">${escapeHtml(err.message)}</div>`;
      }
    }

    window.toggle = async function (userId, shouldSuspend) {
      if (!confirm(shouldSuspend ? 'Suspend this user? They will be locked out immediately.' : 'Restore this user access?')) return;
      try {
        await apiClient.request('admin.js', { action: 'update_user_status', userId, isSuspended: shouldSuspend });
        showToast(`User ${shouldSuspend ? 'suspended' : 'restored'}.`, 'success');
        load();
      } catch (err) { showToast(err.message, 'error'); }
    };
  </script>
</body>
</html>
