<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Control - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/sms.html" class="active">📱 SMS Control</a>
      <a href="/admin/catalog.html">🧩 Catalog</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">SMS Verification Control</div>
        <span class="badge cyan" id="balBadge">Balance: …</span>
      </header>

      <div class="panel">
        <h3>Settings</h3>
        <div class="toggle-row">
          <div>
            <div style="font-weight:600; font-size:14px;">SMS Verification Enabled</div>
            <div style="font-size:12px; color:var(--text-secondary);">Master switch for earners & advertisers.</div>
          </div>
          <label class="switch green"><input type="checkbox" id="sms_enabled" /><span class="slider"></span></label>
        </div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;">
          <div><label class="f-label">USD → NGN Rate</label><input type="number" id="sms_usd_to_ngn_rate" class="f-input" min="100" /></div>
          <div><label class="f-label">Markup (1.5 = +50%)</label><input type="number" id="sms_markup" class="f-input" min="1" max="10" step="0.1" /></div>
          <div><label class="f-label">SMSPool Price Tier (1–3)</label><input type="number" id="sms_price_tier" class="f-input" min="1" max="3" /></div>
        </div>
        <button class="btn btn-primary" style="padding:10px 20px; font-size:13px;" id="saveSettingsBtn">Save Settings</button>
      </div>

      <div class="panel">
        <h3>Enabled Services</h3>
        <div id="svcList"><div class="skeleton skeleton-text"></div></div>
        <button class="btn btn-outline" style="margin-top:14px; padding:10px 18px; font-size:13px;" id="syncBtn">🔄 Sync SMSPool Catalog</button>
        <div id="catalogBox" style="display:none; margin-top:14px;">
          <input type="search" id="catalogSearch" class="f-input" placeholder="Search services (e.g. Telegram)..." />
          <div id="catalogList" style="max-height:260px; overflow-y:auto;"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Verification Audit</h3>
        <div class="table-wrap" id="auditWrap"><div class="skeleton skeleton-text"></div></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let catalog = [];

    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      loadBalance(); loadSettings(); loadServices(); loadAudit();
    })();

    async function loadBalance() {
      try {
        const r = await apiClient.request('smsadmin.js', { action: 'get_balance' });
        document.getElementById('balBadge').textContent = 'SMSPool Balance: $' + Number(r.data.balance_usd).toFixed(2);
      } catch (err) {
        document.getElementById('balBadge').textContent = 'Balance: error';
      }
    }

    async function loadSettings() {
      try {
        const r = await apiClient.request('smsadmin.js', { action: 'get_settings' });
        const s = r.data.settings;
        document.getElementById('sms_enabled').checked = s.sms_enabled === true || s.sms_enabled === 'true';
        document.getElementById('sms_usd_to_ngn_rate').value = s.sms_usd_to_ngn_rate ?? 1600;
        document.getElementById('sms_markup').value = s.sms_markup ?? 1.5;
        document.getElementById('sms_price_tier').value = s.sms_price_tier ?? 2;
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
      try {
        await apiClient.request('smsadmin.js', {
          action: 'update_settings',
          settings: {
            sms_enabled: document.getElementById('sms_enabled').checked,
            sms_usd_to_ngn_rate: Number(document.getElementById('sms_usd_to_ngn_rate').value),
            sms_markup: Number(document.getElementById('sms_markup').value),
            sms_price_tier: Number(document.getElementById('sms_price_tier').value)
          }
        });
        showToast('SMS settings saved.', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    });

    async function loadServices() {
      try {
        const r = await apiClient.request('smsadmin.js', { action: 'get_services' });
        const list = r.data.services || [];
        document.getElementById('svcList').innerHTML = list.length === 0
          ? '<div style="color:var(--text-secondary); font-size:13px;">No services enabled. Sync the catalog below and add some.</div>'
          : list.map(s => `
            <div class="row-item">
              <div>
                <div style="font-weight:700; font-size:14px;">${escapeHtml(s.name)} <span class="row-sub">(SMSPool #${s.smspool_service_id})</span></div>
                <div class="row-sub">Cost $${Number(s.price_usd).toFixed(2)} • Users pay via rate × markup</div>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <span class="badge ${s.is_active ? 'green' : 'gray'}">${s.is_active ? 'Live' : 'Off'}</span>
                <button class="btn btn-outline" style="padding:6px 10px; font-size:11px;" onclick="toggleSvc('${s.id}', ${!s.is_active})">${s.is_active ? 'Disable' : 'Enable'}</button>
                <button class="btn btn-danger" style="padding:6px 10px; font-size:11px;" onclick="delSvc('${s.id}')">Remove</button>
              </div>
            </div>`).join('');
      } catch (err) {
        document.getElementById('svcList').innerHTML = `<div style="color:var(--error); font-size:13px;">${escapeHtml(err.message)}</div>`;
      }
    }

    window.toggleSvc = async function (id, active) {
      try {
        await apiClient.request('smsadmin.js', { action: 'update_service', id, is_active: active });
        loadServices();
      } catch (err) { showToast(err.message, 'error'); }
    };
    window.delSvc = async function (id) {
      if (!confirm('Remove this service?')) return;
      try {
        await apiClient.request('smsadmin.js', { action: 'delete_service', id });
        loadServices();
      } catch (err) { showToast(err.message, 'error'); }
    };

    document.getElementById('syncBtn').addEventListener('click', async () => {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true; btn.textContent = 'Syncing...';
      try {
        const r = await apiClient.request('smsadmin.js', { action: 'sync_catalog' });
        catalog = r.data.catalog || [];
        document.getElementById('catalogBox').style.display = 'block';
        renderCatalog('');
      } catch (err) { showToast(err.message, 'error'); }
      btn.disabled = false; btn.textContent = '🔄 Sync SMSPool Catalog';
    });

    document.getElementById('catalogSearch').addEventListener('input', e => renderCatalog(e.target.value));

    function renderCatalog(filter) {
      const f = filter.toLowerCase().trim();
      const list = catalog.filter(c => !f || c.name.toLowerCase().includes(f)).slice(0, 60);
      document.getElementById('catalogList').innerHTML = list.length === 0
        ? '<div style="color:var(--text-secondary); font-size:13px;">No matches.</div>'
        : list.map(c => `
          <div class="row-item">
            <div>
              <div style="font-weight:600; font-size:13.5px;">${escapeHtml(c.name)}</div>
              <div class="row-sub">#$${Number(c.price_usd).toFixed(2)} • ID ${c.smspool_service_id}</div>
            </div>
            <button class="btn btn-success" style="padding:6px 12px; font-size:11px;" onclick="addSvc(${c.smspool_service_id}, '${escapeHtml(c.name).replace(/'/g, "\\'")}', ${c.price_usd})">Enable</button>
          </div>`).join('');
    }

    window.addSvc = async function (sid, name, price) {
      try {
        await apiClient.request('smsadmin.js', { action: 'add_service', smspool_service_id: sid, name, price_usd: price });
        showToast(name + ' enabled.', 'success');
        loadServices();
      } catch (err) { showToast(err.message, 'error'); }
    };

    async function loadAudit() {
      try {
        const r = await apiClient.request('smsadmin.js', { action: 'get_audit' });
        const list = r.data.verifications || [];
        document.getElementById('auditWrap').innerHTML = list.length === 0
          ? '<div style="color:var(--text-secondary); font-size:13px;">No verifications yet.</div>'
          : `<table class="admin-table"><thead><tr><th>User</th><th>Service</th><th>Number</th><th>Charged</th><th>Status</th><th>When</th></tr></thead><tbody>
            ${list.map(v => `<tr>
              <td>${escapeHtml(v.user_name)}</td>
              <td>${escapeHtml(v.service_name || '')}</td>
              <td style="font-size:12px;">${escapeHtml(v.phone_number || '')}</td>
              <td>${formatCurrency(v.charged_ngn)}${v.refunded ? ' ↩' : ''}</td>
              <td><span class="badge ${v.status === 'VERIFIED' ? 'green' : v.status === 'ACTIVE' ? 'amber' : 'red'}">${v.status}</span></td>
              <td style="font-size:12px; color:var(--text-secondary);">${formatDate(v.created_at)}</td>
            </tr>`).join('')}
          </tbody></table>`;
      } catch (err) {
        document.getElementById('auditWrap').innerHTML = `<div style="color:var(--error); font-size:13px;">${escapeHtml(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
