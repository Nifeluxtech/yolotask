<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leader Console - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .lb-rank { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--text-secondary); flex-shrink: 0; }
    .lb-rank.top1 { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; }
    .lb-rank.top2 { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #fff; }
    .lb-rank.top3 { background: linear-gradient(135deg, #d97706, #92400e); color: #fff; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html" class="active">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Leader Console</div>
      </header>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">Reward your champions. Every reward is logged in the audit trail below.</p>

      <div class="seg" id="periodSeg">
        <button class="active" data-v="week">This Week</button>
        <button data-v="month">This Month</button>
      </div>
      <div class="seg" id="kindSeg">
        <button class="active" data-v="tasks">🏆 Top Workers</button>
        <button data-v="referrals">🤝 Top Referrers</button>
      </div>

      <div id="lbList"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>

      <div class="panel" style="margin-top:24px;">
        <h3>Reward Audit Trail</h3>
        <div id="auditList"><div class="skeleton skeleton-text"></div></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="rewardModal">
    <div class="modal-box">
      <h3 style="margin-bottom:6px;">Send Reward</h3>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">To: <strong id="rwName" style="color:var(--text-primary);"></strong></p>
      <label class="f-label">Amount (₦)</label>
      <input type="number" id="rwAmount" class="f-input" min="1" max="100000" placeholder="e.g. 2000" />
      <label class="f-label">Note (shown to user)</label>
      <input type="text" id="rwNote" class="f-input" maxlength="140" placeholder="e.g. #1 Worker of the Week" />
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-outline" style="padding:9px 16px; font-size:13px;" onclick="closeReward()">Cancel</button>
        <button class="btn btn-primary" style="padding:9px 16px; font-size:13px;" id="rwSendBtn">Send Reward</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let period = 'week', kind = 'tasks', rewardTarget = null;

    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      loadLeaders(); loadAudit();
    })();

    document.getElementById('periodSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#periodSeg button').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); period = b.dataset.v; loadLeaders();
    });
    document.getElementById('kindSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#kindSeg button').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); kind = b.dataset.v; loadLeaders();
    });

    async function loadLeaders() {
      const box = document.getElementById('lbList');
      box.innerHTML = '<div class="panel"><div class="skeleton skeleton-card"></div></div>';
      try {
        const res = await apiClient.request('admin.js', { action: 'get_leaderboard', period, kind });
        const leaders = res.data.leaders || [];
        if (leaders.length === 0) { box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary);">No activity this period yet.</div>'; return; }

        box.innerHTML = leaders.map((l, i) => {
          const rc = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
          const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
          return `
            <div class="panel row-item">
              <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
                <div class="lb-rank ${rc}">${medal}</div>
                <div>
                  <div style="font-weight:700; font-size:14px;">${escapeHtml(l.full_name || 'Anonymous')}</div>
                  <div class="row-sub">${kind === 'tasks' ? l.metric + ' tasks approved' : l.metric + ' referrals'} • earned ${formatCurrency(l.total_reward)}</div>
                </div>
              </div>
              <button class="btn btn-success" style="padding:8px 14px; font-size:12px;" onclick="openReward('${l.user_id}', '${escapeHtml(l.full_name || '').replace(/'/g, "\\'")}')">🎁 Reward</button>
            </div>`;
        }).join('');
      } catch (err) { box.innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`; }
    }

    async function loadAudit() {
      const box = document.getElementById('auditList');
      try {
        const res = await apiClient.request('admin.js', { action: 'get_reward_history' });
        const rewards = res.data.rewards || [];
        if (rewards.length === 0) { box.innerHTML = '<div style="color:var(--text-secondary); font-size:13px;">No rewards sent yet.</div>'; return; }
        box.innerHTML = rewards.map(r => `
          <div class="row-item">
            <div>
              <div style="font-weight:600; font-size:14px;">${escapeHtml(r.user_name)} <span style="color:var(--success);">+${formatCurrency(r.amount)}</span></div>
              <div class="row-sub">${escapeHtml(r.note)}${r.period_label ? ' • ' + escapeHtml(r.period_label) : ''} • ${formatDate(r.created_at)}</div>
            </div>
          </div>
        `).join('');
      } catch (err) { box.innerHTML = `<div style="color:var(--error); font-size:13px;">${escapeHtml(err.message)}</div>`; }
    }

    window.openReward = function (userId, name) {
      rewardTarget = userId;
      document.getElementById('rwName').textContent = name;
      document.getElementById('rwAmount').value = '';
      document.getElementById('rwNote').value = `Top ${kind === 'tasks' ? 'Worker' : 'Referrer'} — ${period === 'week' ? 'This Week' : 'This Month'}`;
      document.getElementById('rewardModal').classList.add('active');
    };
    window.closeReward = function () {
      document.getElementById('rewardModal').classList.remove('active');
      rewardTarget = null;
    };

    document.getElementById('rwSendBtn').addEventListener('click', async () => {
      if (!rewardTarget) return;
      const btn = document.getElementById('rwSendBtn');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        const res = await apiClient.request('admin.js', {
          action: 'reward_leader',
          userId: rewardTarget,
          amount: Number(document.getElementById('rwAmount').value),
          note: document.getElementById('rwNote').value,
          period: `${kind}-${period}`
        });
        showToast(res.message || 'Reward sent!', 'success');
        closeReward(); loadAudit();
      } catch (err) { showToast(err.message, 'error'); }
      btn.disabled = false; btn.textContent = 'Send Reward';
    });
  </script>
</body>
</html>
