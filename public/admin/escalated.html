<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escalated Tasks - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .proof-img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--bg-primary); }
    .comment-box { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--text-secondary); margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/catalog.html">🧩 Catalog</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html" class="active">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Escalated Tasks</div>
        <span class="badge cyan" id="countBadge">0</span>
      </header>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:16px;">Tasks advertisers ignored past their approval window. Verify the proof manually. Proof images auto-delete after decision.</p>
      <div id="list"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('admin.js', { action: 'get_escalated_tasks' });
        const tasks = res.data.tasks || [];
        document.getElementById('countBadge').textContent = tasks.length;
        const box = document.getElementById('list');

        if (tasks.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No escalated tasks. All clear!</div>';
          return;
        }

        box.innerHTML = tasks.map(t => `
          <div class="panel" id="task-${t.id}">
            <div class="row-item" style="border:none; padding:0 0 10px;">
              <div>
                <div style="font-weight:700; font-size:15px;">${escapeHtml(t.campaign?.title || 'Unknown Campaign')}</div>
                <div class="row-sub">Worker: ${escapeHtml(t.earner?.full_name || 'Unknown')} (${escapeHtml(t.earner?.referral_code || 'N/A')}) • ${formatDate(t.created_at)}</div>
              </div>
              <span class="badge amber">ESCALATED</span>
            </div>
            <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;">
              ${t.proof_url ? `<a href="${escapeHtml(t.proof_url)}" target="_blank"><img class="proof-img" src="${escapeHtml(t.proof_url)}" alt="proof" /></a>` : '<div style="font-size:12px; color:var(--text-secondary);">No image</div>'}
              <div style="flex:1; min-width:200px;">
                <div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">Tap image to view full size</div>
                ${t.comment ? `<div class="comment-box"><strong style="color:var(--text-primary);">Worker's note:</strong><br/>${escapeHtml(t.comment)}</div>` : ''}
              </div>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
              <button class="btn btn-danger" style="padding:8px 16px; font-size:12px;" onclick="process('${t.id}','REJECTED')">Reject (Refund)</button>
              <button class="btn btn-success" style="padding:8px 16px; font-size:12px;" onclick="process('${t.id}','APPROVED')">Approve & Pay</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.process = async function (submissionId, reviewAction) {
      if (!confirm(reviewAction === 'APPROVED' ? 'Pay the worker from the advertiser locked funds?' : 'Reject and return funds to advertiser?')) return;
      try {
        await apiClient.request('tasks.js', { action: 'reviewer_process', submissionId, reviewAction });
        showToast(`Task ${reviewAction.toLowerCase()}. Proof image deleted.`, 'success');
        document.getElementById(`task-${submissionId}`)?.remove();
      } catch (err) { showToast(err.message, 'error'); }
    };
  </script>
</body>
</html>
