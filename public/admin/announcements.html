<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements - YOLOTASK Admin</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand yolo-brand">YOLOTASK <span style="font-size:10px; color:var(--error);">ADMIN</span></div>
      <a href="/admin/dashboard.html">📊 Dashboard</a>
      <a href="/admin/leaders.html">🏆 Leader Console</a>
      <a href="/admin/campaigns.html">📝 Campaigns</a>
      <a href="/admin/escalated.html">⚠️ Escalated</a>
      <a href="/admin/withdrawals.html">💸 Withdrawals</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/announcements.html" class="active">📢 Announcements</a>
      <a href="/admin/settings.html">⚙️ Settings</a>
      <a href="/login.html" onclick="localStorage.clear()" class="logout">🚪 Logout</a>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <div class="page-title">Announcements</div>
      </header>

      <div class="panel">
        <h3>New Broadcast</h3>
        <label class="f-label">Title</label>
        <input type="text" id="annTitle" class="f-input" placeholder="e.g. New premium tasks this weekend" />
        <label class="f-label">Type</label>
        <select id="annType" class="f-input">
          <option value="GENERAL">General</option>
          <option value="PROMO">Promotion</option>
          <option value="MAINTENANCE">Maintenance Notice</option>
          <option value="SECURITY">Security Notice</option>
        </select>
        <label class="f-label">Message</label>
        <textarea id="annMessage" class="f-input" style="min-height:120px;" placeholder="Write your announcement..."></textarea>

        <div class="toggle-row">
          <div>
            <div style="font-weight:600; font-size:14px;">Also send via Email</div>
            <div style="font-size:12px; color:var(--text-secondary);">Broadcasts to every registered email (Resend).</div>
          </div>
          <label class="switch"><input type="checkbox" id="annEmail" /><span class="slider"></span></label>
        </div>

        <button class="btn btn-primary w-full" id="publishBtn">Publish Announcement</button>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('admin');
      if (!profile) return;

      document.getElementById('publishBtn').addEventListener('click', async () => {
        const title = document.getElementById('annTitle').value.trim();
        const message = document.getElementById('annMessage').value.trim();
        const sendEmail = document.getElementById('annEmail').checked;

        if (!title || !message) { showToast('Title and message are required.', 'error'); return; }
        if (sendEmail && !confirm('This will email EVERY registered user. Continue?')) return;

        const btn = document.getElementById('publishBtn');
        btn.disabled = true; btn.textContent = sendEmail ? 'Publishing & emailing...' : 'Publishing...';

        try {
          const res = await apiClient.request('admin.js', {
            action: 'create_announcement',
            title, message,
            type: document.getElementById('annType').value,
            sendEmail
          });
          showToast(res.message || 'Published.', 'success');
          document.getElementById('annTitle').value = '';
          document.getElementById('annMessage').value = '';
          document.getElementById('annEmail').checked = false;
        } catch (err) { showToast(err.message, 'error'); }
        btn.disabled = false; btn.textContent = 'Publish Announcement';
      });
    })();
  </script>
</body>
</html>
