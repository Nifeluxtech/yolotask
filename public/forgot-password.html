<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .auth-box { background: var(--bg-secondary); padding: 40px; border-radius: var(--radius-lg); width: 100%; max-width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="auth-box">
    <h2 style="margin-bottom: 20px; text-align: center;">Reset Password</h2>
    <p style="color: var(--text-secondary); margin-bottom: 30px; text-align: center; font-size: 14px;">Enter your email to receive a reset link.</p>
    <form id="resetForm">
      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom:8px; font-size:14px; color:var(--text-secondary);">Email Address</label>
        <input type="email" id="email" required />
      </div>
      <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
    </form>
    <p style="text-align:center; margin-top:20px; font-size:14px;"><a href="/login.html" style="color:var(--accent); text-decoration:none;">Back to Login</a></p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await apiClient.request('auth.js', { action: 'forgot-password', email: document.getElementById('email').value });
        showToast('Reset link sent to your email!', 'success');
        btn.textContent = 'Sent!';
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
