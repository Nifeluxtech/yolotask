<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - YOLOTASK</title>
  <style>
    body { background: #0A1628; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; margin: 0; }
    h1 { color: #00D4FF; font-size: 40px; margin: 0 0 10px; }
    p { color: #94a3b8; margin-bottom: 25px; }
    button { background: #00D4FF; color: #0A1628; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>📡 Offline</h1>
    <p>You're not connected to the internet.<br/>Your balance and tasks are safe — reconnect to continue.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
