<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Verification - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .step-label { font-size: 15px; font-weight: 800; margin: 18px 0 10px; }
    .pick-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .pick-box select, .pick-box input { flex: 1; background: transparent; border: none; color: var(--text-primary); padding: 13px 4px; font-size: 14px; outline: none; }
    .pick-box select option { background: var(--bg-secondary); color: var(--text-primary); }
    .svc-list { max-height: 260px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .svc-item { display: flex; align-items: center; gap: 10px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; cursor: pointer; font-size: 13px; font-weight: 700; transition: .15s; }
    .svc-item:hover { border-color: var(--accent); background: var(--accent-glow); }
    .svc-dot { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-glow); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .session-card { background: var(--bg-secondary); border: 2px solid var(--accent); border-radius: 18px; padding: 22px; margin-bottom: 18px; text-align: center; }
    .session-card.verified { border-color: var(--success); background: var(--success-bg); }
    .session-card.failed { border-color: var(--error); background: var(--error-bg); }
    .big-number { font-size: 26px; font-weight: 900; letter-spacing: 1px; margin: 10px 0; }
    .otp-box { background: var(--bg-primary); border: 1px dashed var(--accent); border-radius: 12px; padding: 14px; font-size: 28px; font-weight: 900; letter-spacing: 6px; margin: 12px auto; max-width: 260px; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <a href="javascript:history.back()" style="color:var(--accent); text-decoration:none; font-weight:600;">← Back</a>
    <div style="font-weight:700; font-size:15px;">SMS Verification</div>
  </header>

  <main class="container" style="padding:22px 18px 120px; max-width:760px;">
    <div class="panel" style="display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:13px; color:var(--text-secondary);">Wallet Balance</div>
      <div style="font-weight:800; color:var(--success); font-size:18px;" id="balLabel">₦0.00</div>
    </div>

    <div id="sessionArea"></div>

    <div class="step-label">1. Select country</div>
    <div class="pick-box">
      <span id="countryFlag" style="font-size:18px;">🌍</span>
      <select id="countrySelect"><option value="">Loading countries…</option></select>
    </div>

    <div class="step-label">2. Select service</div>
    <div class="pick-box">
      <span style="font-size:16px;">🔎</span>
      <input type="search" id="serviceSearch" placeholder="Search services (Facebook, Telegram, TikTok…)" />
    </div>
    <div class="svc-list" id="svcList"><div class="skeleton skeleton-card" style="grid-column:1/-1;"></div></div>

    <h2 style="font-size:18px; margin:26px 0 12px;">My Verification History</h2>
    <div id="histList"><div class="skeleton skeleton-text"></div></div>
  </main>

  <!-- Quote + start modal -->
  <div class="modal-overlay" id="startModal">
    <div class="modal-box">
      <h3 style="margin-bottom:6px;">Verify <span id="mSvcName"></span></h3>
      <div style="font-size:13px; color:var(--text-secondary); margin-bottom:6px;">Country: <strong id="mCountry" style="color:var(--text-primary);"></strong></div>
      <p style="font-size:14px; margin-bottom:14px;">Live price: <strong id="mPrice" style="color:var(--success);">fetching…</strong></p>
      <label class="f-label">Social username / handle (optional)</label>
      <input type="text" id="mUsername" class="f-input" placeholder="@yourhandle" />
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-outline" style="padding:9px 16px; font-size:13px;" onclick="closeStart()">Cancel</button>
        <button class="btn btn-primary" style="padding:9px 16px; font-size:13px;" id="mStartBtn" disabled>Get Number</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const ICONS = { telegram: '✈️', whatsapp: '💬', instagram: '📸', tiktok: '🎵', youtube: '▶️', x: '✖️', twitter: '🐦', facebook: '📘', snapchat: '👻', google: '🔍' };
    let countries = [];
    let services = [];
    let pollTimer = null;
    let activeId = null;
    let session = null; // { number, serviceName, countryName }
    let pending = null; // { service, quote }

    function flagEmoji(short) {
      if (!short || short.length !== 2) return '🌍';
      return short.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
    }

    (async () => {
      const profile = await checkAuthAndRedirect();
      if (!profile) return;
      if (!['earner', 'advertiser'].includes(profile.role)) { window.location.href = '/'; return; }
      loadBalance();
      loadCountries();
      loadServices();
      loadHistory();
    })();

    async function loadBalance() {
      try {
        const r = await apiClient.request('sms.js', { action: 'get_wallet_balance' });
        document.getElementById('balLabel').textContent = formatCurrency(r.data.available_balance);
      } catch (e) {}
    }

    async function loadCountries() {
      const sel = document.getElementById('countrySelect');
      try {
        const r = await apiClient.request('sms.js', { action: 'get_countries' });
        if (!r.data.enabled) { sel.innerHTML = '<option value="">SMS verification disabled</option>'; return; }
        countries = r.data.countries || [];
        sel.innerHTML = '<option value="">— Select country —</option>' +
          countries.map(c => `<option value="${c.id}" data-short="${escapeHtml(c.short || '')}">${flagEmoji(c.short)} ${escapeHtml(c.name)}</option>`).join('');
        sel.addEventListener('change', () => {
          const opt = sel.selectedOptions[0];
          document.getElementById('countryFlag').textContent = opt?.value ? flagEmoji(opt.dataset.short) : '🌍';
        });
      } catch (err) {
        sel.innerHTML = `<option value="">Failed: ${escapeHtml(err.message).slice(0, 40)}</option>`;
      }
    }

    async function loadServices() {
      try {
        const r = await apiClient.request('sms.js', { action: 'get_services' });
        if (!r.data.enabled) {
          document.getElementById('svcList').innerHTML = '<div class="panel" style="grid-column:1/-1; text-align:center; color:var(--text-secondary);">SMS verification is currently disabled.</div>';
          return;
        }
        services = r.data.services || [];
        renderServices('');

        const h = await apiClient.request('sms.js', { action: 'get_history' });
        const active = (h.data.verifications || []).find(v => v.status === 'ACTIVE');
        if (active) {
          activeId = active.id;
          session = { number: active.phone_number, serviceName: active.service_name, countryName: active.country_name };
          renderSession('ACTIVE', null);
          startPolling();
        }
      } catch (err) {
        document.getElementById('svcList').innerHTML = `<div class="panel" style="grid-column:1/-1; color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderServices(filter) {
      const f = filter.toLowerCase().trim();
      const list = (f ? services.filter(s => s.name.toLowerCase().includes(f)) : services).slice(0, 120);
      document.getElementById('svcList').innerHTML = list.length === 0
        ? '<div style="grid-column:1/-1; color:var(--text-secondary); font-size:13px;">No matches.</div>'
        : list.map(s => `
          <div class="svc-item" onclick="openStart(${s.smspool_service_id}, '${escapeHtml(s.name).replace(/'/g, "\\'")}')">
            <span class="svc-dot">${ICONS[s.name.toLowerCase()] || escapeHtml(s.name.charAt(0).toUpperCase())}</span>
            <span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(s.name)}</span>
          </div>`).join('');
    }
    document.getElementById('serviceSearch').addEventListener('input', e => renderServices(e.target.value));

    async function loadHistory() {
      try {
        const r = await apiClient.request('sms.js', { action: 'get_history' });
        const list = r.data.verifications || [];
        document.getElementById('histList').innerHTML = list.length === 0
          ? '<div class="panel" style="color:var(--text-secondary); font-size:13px;">No verifications yet.</div>'
          : list.map(v => `
            <div class="row-item">
              <div>
                <div style="font-weight:700; font-size:14px;">${ICONS[(v.service_name || '').toLowerCase()] || '📱'} ${escapeHtml(v.service_name || 'Service')} ${v.country_name ? '• ' + escapeHtml(v.country_name) : ''}</div>
                <div class="row-sub">${formatDate(v.created_at)} • ${formatCurrency(v.charged_ngn)}${v.refunded ? ' (refunded)' : ''}${v.social_username ? ' • ' + escapeHtml(v.social_username) : ''}</div>
              </div>
              <span class="badge ${v.status === 'VERIFIED' ? 'green' : v.status === 'ACTIVE' ? 'amber' : 'red'}">${v.status}</span>
            </div>`).join('');
      } catch (e) {}
    }

    window.openStart = async function (serviceId, serviceName) {
      const countryId = document.getElementById('countrySelect').value;
      if (!countryId) { showToast('Select a country first.', 'error'); return; }

      pending = { service: { id: serviceId, name: serviceName }, quote: null };
      document.getElementById('mSvcName').textContent = serviceName;
      document.getElementById('mCountry').textContent = document.getElementById('countrySelect').selectedOptions[0]?.textContent || '';
      document.getElementById('mPrice').textContent = 'fetching…';
      document.getElementById('mStartBtn').disabled = true;
      document.getElementById('mUsername').value = '';
      document.getElementById('startModal').classList.add('active');

      try {
        const q = await apiClient.request('sms.js', { action: 'get_quote', serviceId, countryId });
        pending.quote = q.data;
        document.getElementById('mPrice').textContent = `${formatCurrency(q.data.price_ngn)}  (pool cost $${Number(q.data.price_usd).toFixed(2)})`;
        document.getElementById('mStartBtn').disabled = false;
      } catch (err) {
        document.getElementById('mPrice').textContent = err.message;
        pending.quote = null;
      }
    };
    window.closeStart = function () { document.getElementById('startModal').classList.remove('active'); pending = null; };

    document.getElementById('mStartBtn').addEventListener('click', async () => {
      if (!pending || !pending.quote) return;
      const btn = document.getElementById('mStartBtn');
      btn.disabled = true; btn.textContent = 'Buying number...';
      const sel = document.getElementById('countrySelect');
      try {
        const r = await apiClient.request('sms.js', {
          action: 'start_verification',
          serviceId: pending.service.id,
          serviceName: pending.service.name,
          countryId: sel.value,
          countryName: (sel.selectedOptions[0]?.textContent || '').replace(/^[^A-Za-z]+/, '').trim(),
          social_username: document.getElementById('mUsername').value
        });
        activeId = r.data.verification.id;
        session = { number: r.data.verification.number, serviceName: r.data.verification.service_name, countryName: r.data.verification.country_name };
        closeStart();
        loadBalance();
        renderSession('ACTIVE', null);
        startPolling();
        showToast(r.message || 'Number assigned.', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Get Number';
    });

    function renderSession(status, otp) {
      const area = document.getElementById('sessionArea');
      const sName = session?.serviceName || '';
      const cName = session?.countryName || '';
      const number = session?.number || '';

      if (status === 'ACTIVE') {
        area.innerHTML = `
          <div class="session-card">
            <div style="font-size:13px; color:var(--text-secondary);">Your rented ${escapeHtml(sName)} number (${escapeHtml(cName)})</div>
            <div class="big-number" id="sessNumber">${escapeHtml(number)}</div>
            <button class="btn btn-outline" style="padding:7px 14px; font-size:12px; margin-bottom:12px;" onclick="copyNumber()">Copy Number</button>
            <div class="spinner"></div>
            <div style="font-size:13px; color:var(--text-secondary);">Enter this number in your ${escapeHtml(sName)} app.<br/>The code appears here automatically.</div>
            <button class="btn btn-danger" style="padding:8px 16px; font-size:12px; margin-top:14px;" onclick="cancelSession()">Cancel & Refund</button>
          </div>`;
      } else if (status === 'VERIFIED') {
        stopPolling();
        area.innerHTML = `
          <div class="session-card verified">
            <div style="font-size:22px;">✅</div>
            <div style="font-weight:900; font-size:17px; color:var(--success); margin:6px 0;">Verified!</div>
            <div style="font-size:13px; color:var(--text-secondary);">Your ${escapeHtml(sName)} code:</div>
            <div class="otp-box" id="otpBox">${escapeHtml(otp || '')}</div>
            <button class="btn btn-primary" style="padding:9px 18px; font-size:13px;" onclick="copyOtp()">Copy Code</button>
          </div>`;
        loadHistory(); loadBalance();
      } else {
        stopPolling();
        area.innerHTML = `
          <div class="session-card failed">
            <div style="font-size:22px;">❌</div>
            <div style="font-weight:900; font-size:16px; color:var(--error); margin:6px 0;">Verification failed</div>
            <div style="font-size:13px; color:var(--text-secondary);">No code received. Your wallet has been refunded in full.</div>
          </div>`;
        loadHistory(); loadBalance();
      }
    }

    window.copyNumber = () => {
      const n = (session?.number || '').replace(/\D/g, '');
      navigator.clipboard?.writeText(n).then(() => showToast('Number copied!', 'success')).catch(() => showToast(n, 'warning'));
    };
    window.copyOtp = () => {
      const o = document.getElementById('otpBox')?.textContent || '';
      navigator.clipboard?.writeText(o).then(() => showToast('Code copied!', 'success')).catch(() => showToast(o, 'warning'));
    };

    window.cancelSession = async function () {
      if (!activeId || !confirm('Cancel this verification and refund your wallet?')) return;
      try {
        await apiClient.request('sms.js', { action: 'cancel_verification', verificationId: activeId });
        showToast('Cancelled and refunded.', 'success');
        stopPolling();
        activeId = null; session = null;
        document.getElementById('sessionArea').innerHTML = '';
        loadHistory(); loadBalance();
      } catch (err) { showToast(err.message, 'error'); }
    };

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        if (!activeId) return stopPolling();
        try {
          const r = await apiClient.request('sms.js', { action: 'poll_status', verificationId: activeId });
          const d = r.data;
          session = session || {};
          session.number = d.number || session.number;
          session.serviceName = d.service_name || session.serviceName;
          session.countryName = d.country_name || session.countryName;
          if (d.status === 'VERIFIED') { renderSession('VERIFIED', d.otp); activeId = null; }
          else if (d.status === 'FAILED' || d.status === 'CANCELLED') { renderSession('FAILED', null); activeId = null; session = null; }
        } catch (e) { /* keep polling */ }
      }, 4000);
    }
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  </script>
</body>
</html>
