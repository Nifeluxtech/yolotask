<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .search-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .search-input { flex: 1; padding: 13px 16px 13px 42px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary); font-size: 14px; }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-muted); }
    .filter-btn { width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .filter-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
    .filter-btn.active .dot { display: block; }

    .task-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; transition: .15s; }
    .task-card:active { transform: scale(.99); }
    .tc-top { display: flex; gap: 14px; align-items: flex-start; }
    .tc-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-primary); border: 1px solid var(--border); padding: 8px; object-fit: contain; flex-shrink: 0; }
    .tc-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; }
    .tc-title { font-size: 17px; font-weight: 800; margin-bottom: 2px; }
    .tc-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .tc-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 11.5px; font-weight: 700; color: var(--text-primary); }
    .tc-chip.prem { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
    .tc-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; }
    .tc-earn-lbl { font-size: 12px; color: var(--text-secondary); }
    .tc-earn { font-size: 20px; font-weight: 900; }
    .tc-start { padding: 11px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); font-weight: 800; font-size: 14px; cursor: pointer; transition: .15s; text-decoration: none; }
    .tc-start:hover { border-color: var(--accent); color: var(--accent); }

    /* Filter drawer */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1500; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(88vw, 380px); background: var(--bg-primary); z-index: 1600; transform: translateX(100%); transition: transform .3s cubic-bezier(.25,.8,.25,1); overflow-y: auto; padding: 22px 20px 40px; }
    .drawer.open { transform: translateX(0); }
    .drawer h3 { font-size: 14px; margin: 18px 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; }
    .radio-row { display: flex; align-items: center; gap: 10px; padding: 11px 4px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
    .radio-row input { width: 18px; height: 18px; accent-color: var(--accent); }
    .radio-row img { width: 22px; height: 22px; object-fit: contain; border-radius: 6px; }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK</div>
    <div style="font-weight:700; font-size:15px;">Tasks</div>
  </header>

  <main class="container" style="padding:20px 18px 120px; max-width:760px;">
    <h1 style="font-size:22px; margin-bottom:16px;">Available Tasks</h1>

    <div class="search-row">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" id="searchBox" class="search-input" placeholder="Search tasks..." />
      </div>
      <button class="filter-btn" id="filterBtn" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span class="dot"></span>
      </button>
    </div>

    <div id="taskFeed"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
  </main>

  <!-- FILTER DRAWER -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="flex justify-between items-center">
      <h2 style="font-size:18px;">Filters</h2>
      <button onclick="closeDrawer()" style="background:none; border:none; color:var(--text-secondary); font-size:20px; cursor:pointer;">✕</button>
    </div>

    <h3>Platform</h3>
    <div id="platFilters"><div style="font-size:13px; color:var(--text-secondary);">Loading...</div></div>

    <h3>Task Type</h3>
    <div id="typeFilters"><div style="font-size:13px; color:var(--text-secondary);">Loading...</div></div>

    <button class="btn btn-primary w-full" style="margin-top:22px;" onclick="applyFilters()">Apply Filters</button>
    <button class="btn btn-outline w-full" style="margin-top:10px;" onclick="resetFilters()">Reset</button>
  </aside>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let allTasks = [];
    let platforms = [];
    let taskTypes = [];
    let query = '';
    let fPlatform = 'all';
    let fType = 'all';

    (async () => {
      const profile = await checkAuthAndRedirect('earner');
      if (!profile) return;
      try {
        const res = await apiClient.request('tasks.js', { action: 'get_feed' });
        allTasks = res.data.tasks || [];
        platforms = res.data.platforms || [];
        taskTypes = res.data.task_types || [];
        buildFilterUI();
        render();
      } catch (err) {
        document.getElementById('taskFeed').innerHTML = `<div class="task-card" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    })();

    function buildFilterUI() {
      document.getElementById('platFilters').innerHTML =
        `<label class="radio-row"><input type="radio" name="fPlat" value="all" ${fPlatform === 'all' ? 'checked' : ''} /> <span>All</span></label>` +
        platforms.map(p => `
          <label class="radio-row"><input type="radio" name="fPlat" value="${escapeHtml(p.name)}" ${fPlatform === p.name ? 'checked' : ''} />
          <img src="${p.logo_url || '/icons/icon.svg'}" onerror="this.src='/icons/icon.svg'" alt="" /> <span>${escapeHtml(p.name)}</span></label>`).join('') +
        `<label class="radio-row"><input type="radio" name="fPlat" value="Other" ${fPlatform === 'Other' ? 'checked' : ''} /> <img src="/icons/icon.svg" alt="" /> <span>Other</span></label>`;

      document.getElementById('typeFilters').innerHTML =
        `<label class="radio-row"><input type="radio" name="fType" value="all" ${fType === 'all' ? 'checked' : ''} /> <span>All</span></label>` +
        taskTypes.map(t => `
          <label class="radio-row"><input type="radio" name="fType" value="${escapeHtml(t.name)}" ${fType === t.name ? 'checked' : ''} /> <span>${escapeHtml(t.name)}</span></label>`).join('');
    }

    window.openDrawer = () => { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); };
    window.closeDrawer = () => { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); };
    document.getElementById('filterBtn').addEventListener('click', openDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

    window.applyFilters = () => {
      const p = document.querySelector('input[name="fPlat"]:checked');
      const t = document.querySelector('input[name="fType"]:checked');
      fPlatform = p ? p.value : 'all';
      fType = t ? t.value : 'all';
      const active = fPlatform !== 'all' || fType !== 'all';
      document.getElementById('filterBtn').classList.toggle('active', active);
      closeDrawer();
      render();
    };

    window.resetFilters = () => {
      fPlatform = 'all'; fType = 'all'; query = '';
      document.getElementById('searchBox').value = '';
      document.getElementById('filterBtn').classList.remove('active');
      buildFilterUI();
      closeDrawer();
      render();
    };

    document.getElementById('searchBox').addEventListener('input', (e) => { query = e.target.value.toLowerCase().trim(); render(); });

    function render() {
      let list = allTasks;
      if (fPlatform !== 'all') list = list.filter(t => t.platform_name === fPlatform);
      if (fType !== 'all') list = list.filter(t => t.task_type === fType);
      if (query) list = list.filter(t => (t.title + ' ' + t.task_type + ' ' + t.platform_name).toLowerCase().includes(query));

      const feed = document.getElementById('taskFeed');
      if (list.length === 0) {
        feed.innerHTML = '<div class="task-card" style="text-align:center; color:var(--text-secondary); padding:44px;">No tasks match right now.<br/>New campaigns drop daily — check back soon.</div>';
        return;
      }

      feed.innerHTML = list.map(t => `
        <div class="task-card">
          <div class="tc-top">
            <img class="tc-logo" src="${t.platform_logo || '/icons/icon.svg'}" onerror="this.src='/icons/icon.svg'" alt="" />
            <div style="flex:1; min-width:0;">
              <div class="tc-meta">${escapeHtml(t.platform_name)} • Task</div>
              <div class="tc-title">${escapeHtml(t.task_type)}</div>
              <div class="tc-sub">${escapeHtml(t.title)}</div>
              <div class="tc-chips">
                <span class="tc-chip">👥 ${t.slots_left} slots left</span>
                <span class="tc-chip">☑️ ${escapeHtml(t.verification_label)}</span>
                ${t.is_premium ? '<span class="tc-chip prem">★ 2x Premium</span>' : ''}
              </div>
            </div>
          </div>
          <div class="tc-bottom">
            <div>
              <div class="tc-earn-lbl">Earn</div>
              <div class="tc-earn">${formatCurrency(t.reward)}</div>
            </div>
            <a class="tc-start" href="/earner/task-details.html?id=${t.id}">Start Task</a>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
