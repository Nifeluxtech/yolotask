<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .task-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; transition: transform .2s; }
    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .task-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-glow); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
    .task-icon img { width: 100%; height: 100%; object-fit: cover; }
    .task-info h3 { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--text-primary); }
    .task-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
    .badge-platform { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; font-weight: 600; text-transform: capitalize; }
    .slots-pill { background: var(--success-bg); color: var(--success); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
    .earn-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: center; }
    .earn-label { font-size: 12px; color: var(--text-secondary); }
    .earn-val { font-size: 20px; font-weight: 800; color: var(--success); }
    .btn-start { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .btn-start:hover { opacity: 0.9; }
    .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
    .filter-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK</div>
    <div style="font-weight:700; font-size:15px;">Tasks</div>
  </header>

  <main class="container" style="padding:10px 18px 120px; max-width:760px;">
    
    <!-- Search -->
    <div class="pick-box" style="margin-bottom:16px;">
      <span>🔍</span>
      <input type="search" id="searchInput" placeholder="Search tasks..." style="background:transparent; border:none; color:var(--text-primary); padding:12px 4px; width:100%; outline:none;" />
    </div>

    <!-- Filters -->
    <div class="filter-bar" id="filters">
      <button class="filter-chip active" onclick="setFilter('all')">All Tasks</button>
      <button class="filter-chip" onclick="setFilter('facebook')">Facebook</button>
      <button class="filter-chip" onclick="setFilter('whatsapp')">WhatsApp</button>
      <button class="filter-chip" onclick="setFilter('instagram')">Instagram</button>
      <button class="filter-chip" onclick="setFilter('tiktok')">TikTok</button>
    </div>

    <!-- List Container -->
    <div id="taskList">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let allCampaigns = [];
    let currentFilter = 'all';

    (async () => {
      const profile = await checkAuthAndRedirect();
      if (!profile) return;
      loadTasks();
    })();

    async function loadTasks() {
      try {
        const res = await apiClient.request('campaigns.js', { action: 'get_active_campaigns' });
        allCampaigns = res.data.campaigns || [];
        renderTasks();
      } catch (err) {
        document.getElementById('taskList').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.setFilter = function(type) {
      currentFilter = type;
      // Update chips visually
      document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      renderTasks();
    };

    document.getElementById('searchInput').addEventListener('input', renderTasks);

    function renderTasks() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = allCampaigns.filter(c => {
        // Text search
        const matchesText = c.title.toLowerCase().includes(query) || c.description?.toLowerCase().includes(query);
        
        // Category Filter Logic
        let matchesCat = true;
        if (currentFilter !== 'all') {
          // Check against the NEW field from API
          const platName = (c.platform_name || '').toLowerCase();
          matchesCat = platName.includes(currentFilter);
        }
        
        return matchesText && matchesCat;
      });

      const container = document.getElementById('taskList');
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary);">No tasks found.</div>';
        return;
      }

      container.innerHTML = filtered.map(c => {
        // Determine Icon
        const iconSrc = c.platform_logo;
        const iconName = c.platform_name || 'Task';
        const initials = iconName.substring(0, 1).toUpperCase();
        
        return `
          <div class="task-card">
            <div class="task-header">
              <div class="task-icon">
                ${iconSrc ? `<img src="${iconSrc}" alt="${iconName}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/><span style="display:none">${initials}</span>` : initials}
              </div>
              <div class="task-info" style="flex:1;">
                <h3>${escapeHtml(c.title)}</h3>
                <div class="task-meta">
                  <span class="badge-platform">${escapeHtml(iconName)}</span>
                  <span>•</span>
                  <span>${escapeHtml(c.task_type_name)}</span>
                </div>
              </div>
            </div>
            
            <p style="font-size:13px; color:var(--text-secondary); margin:0 0 12px;">${escapeHtml(c.description || '')}</p>
            
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <span class="slots-pill">👥 ${(c.total_slots - c.filled_slots)} slots left</span>
              <span class="slots-pill" style="background:rgba(255,255,255,0.05); color:var(--text-secondary);">✅ Verify in 24–48h</span>
            </div>

            <div class="earn-box">
              <div>
                <div class="earn-label">Earn</div>
                <div class="earn-val">₦${Number(c.earn_amount).toLocaleString()}</div>
              </div>
              <button class="btn-start" onclick="startTask('${c.id}')">Start Task</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.startTask = async function(id) {
      showToast('Opening task...', 'info');
      // Navigate to detail page or modal logic here
      window.location.href = `/earner/task-detail.html?id=${id}`;
    };
  </script>
</body>
</html>
