<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .seg { display: flex; gap: 8px; margin-bottom: 14px; }
    .seg button { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-secondary); padding: 10px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 13px; }
    .seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .search-box { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; color: var(--text-primary); margin-bottom: 16px; font-size: 14px; }
    .task-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .task-card:active { transform: scale(0.99); }
    .prem { background: var(--warning-bg); color: var(--warning); padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; }
    .gen { background: var(--accent-glow); color: var(--accent); padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding: 15px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);">
    <div style="font-weight:800; color:var(--accent);">YOLOTASK</div>
    <a href="/earner/notifications.html" style="color:var(--text-secondary); text-decoration:none; font-size:20px;" aria-label="Notifications">🔔</a>
  </header>

  <div class="container" style="padding: 22px 20px; max-width: 720px;">
    <h1 style="font-size:22px; margin-bottom:14px;">Available Tasks</h1>

    <input type="search" id="searchBox" class="search-box" placeholder="Search tasks..." />

    <div class="seg" id="feedTabs">
      <button class="active" data-f="all">All</button>
      <button data-f="general">General</button>
      <button data-f="premium">★ Premium</button>
    </div>

    <div id="taskFeed"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let allTasks = [];
    let filter = 'all';
    let query = '';

    (async () => {
      const profile = await checkAuthAndRedirect('earner');
      if (!profile) return;

      try {
        const res = await apiClient.request('tasks.js', { action: 'get_feed' });
        allTasks = res.data.tasks || [];
        render();
      } catch (err) {
        document.getElementById('taskFeed').innerHTML = `<div class="task-card" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    })();

    document.getElementById('feedTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button'); if (!btn) return;
      document.querySelectorAll('#feedTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.f;
      render();
    });

    document.getElementById('searchBox').addEventListener('input', (e) => {
      query = e.target.value.toLowerCase().trim();
      render();
    });

    function render() {
      let list = allTasks;
      if (filter === 'general') list = list.filter(t => !t.is_premium);
      if (filter === 'premium') list = list.filter(t => t.is_premium);
      if (query) list = list.filter(t => (t.title + ' ' + t.task_type).toLowerCase().includes(query));

      const feed = document.getElementById('taskFeed');

      if (list.length === 0) {
        feed.innerHTML = '<div class="task-card" style="justify-content:center; color:var(--text-secondary); padding:40px; text-align:center;">No tasks match right now.<br/>Check back soon — new campaigns drop daily.</div>';
        return;
      }

      feed.innerHTML = list.map(t => `
        <a href="/earner/task-details.html?id=${t.id}" style="text-decoration:none; color:inherit;">
          <div class="task-card">
            <div style="min-width:0; flex:1;">
              <span class="${t.is_premium ? 'prem' : 'gen'}">${t.is_premium ? '★ PREMIUM 2x' : 'GENERAL'}</span>
              <div style="font-weight:700; font-size:15px; margin:8px 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(t.title)}</div>
              <div style="font-size:12px; color:var(--text-secondary);">${escapeHtml(t.task_type)} • ${t.slots_left} slots left</div>
            </div>
            <div style="text-align:right; flex-shrink:0;">
              <div style="font-weight:800; color:var(--success); font-size:16px;">${formatCurrency(t.reward)}</div>
              <div style="font-size:11px; color:var(--accent); font-weight:700; margin-top:4px;">Start →</div>
            </div>
          </div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
