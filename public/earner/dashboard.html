<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboad.css" />
  <link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/mobile-nav.css" />
<link rel="stylesheet" href="/css/ui-components.css" />
<!-- Remove old auth.css/dashboard.css if they conflict, or merge them -->
</head>
<body>
  <header class="app-header">
    <a href="/earner/dashboard.html" class="header-logo">YOLOTASK</a>
    <div class="header-user">
      <span id="userName">Loading...</span>
      <a href="/login.html" onclick="localStorage.clear()" style="color:var(--error); text-decoration:none; margin-left:10px;">Logout</a>
    </div>
  </header>

  <div class="dashboard-container">
    <h1 style="margin-bottom:20px;">Welcome Back</h1>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Available Balance</div>
        <div class="stat-value accent" id="walletBalance">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tasks Completed</div>
        <div class="stat-value" id="tasksCompleted">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Reputation Rank</div>
        <div class="stat-value" id="repRank">Bronze</div>
      </div>
    </div>

    <div style="display:flex; gap:15px; flex-wrap:wrap;">
      <a href="/earner/tasks.html" class="btn-outline" style="padding:12px 24px; font-size:16px;">Browse Available Tasks</a>
      <a href="/earner/wallet.html" class="btn-outline" style="padding:12px 24px; font-size:16px;">Withdraw Funds</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('earner');
      if (!profile) return;

      document.getElementById('userName').textContent = profile.full_name;
      // In a real app, fetch wallet and stats from /api/wallet.js and /api/tasks.js
      // For MVP structure, we initialize the UI.
    })();
  </script>
  <!-- Mobile Bottom Navigation -->
<nav class="mobile-bottom-nav">
  <a href="/earner/dashboard.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    <span>Home</span>
  </a>
  <a href="/earner/tasks.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
    <span>Tasks</span>
  </a>
  <a href="/earner/wallet.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
    <span>Wallet</span>
  </a>
  <a href="/earner/referrals.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    <span>Refer</span>
  </a>
  <a href="/earner/profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    <span>Profile</span>
  </a>
</nav>

<script src="/js/ui.js"></script>
<script>

  // with:

</script>
</body>
</html>
