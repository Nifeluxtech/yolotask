<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/mobile-nav.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .balance-card { background: linear-gradient(135deg, var(--accent), #0077aa); border-radius: var(--radius-lg); padding: 30px; color: #fff; margin-bottom: 20px; }
    .balance-label { font-size: 13px; opacity: 0.85; }
    .balance-value { font-size: 36px; font-weight: 800; margin: 5px 0; }
    .balance-sub { display: flex; gap: 20px; font-size: 13px; opacity: 0.9; }
    .tx-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; gap: 10px; }
    .tx-row:last-child { border-bottom: none; }
    .settings-select { width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); margin-bottom: 15px; }
    .wd-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; flex-wrap: wrap; }
    .wd-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding: 15px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);">
    <a href="/earner/dashboard.html" style="color:var(--accent); text-decoration:none; font-weight:600;">← Back</a>
    <div style="font-weight:800; color:var(--accent);">Wallet</div>
  </header>

  <div class="container" style="padding: 30px 20px; max-width: 640px;">
    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-value" id="availBalance">₦0.00</div>
      <div class="balance-sub">
        <span>Pending: <strong id="pendBalance">₦0.00</strong></span>
        <span>Locked: <strong id="lockBalance">₦0.00</strong></span>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px; padding:20px;">
      <h3 style="margin-bottom:15px;">Request Withdrawal</h3>
      <p style="font-size:13px; color:var(--text-secondary); margin-bottom:15px;">Minimum: <strong id="minWd">₦1,000</strong> • Processed within 24 hours</p>
      <label style="display:block; margin-bottom:8px; font-size:14px; color:var(--text-secondary);">Payout Account</label>
      <select id="bankSelect" class="settings-select"></select>
      <label style="display:block; margin-bottom:8px; font-size:14px; color:var(--text-secondary);">Amount (₦)</label>
      <input type="number" id="wdAmount" class="settings-select" placeholder="e.g. 2000" min="1" />
      <button class="btn btn-primary w-full" id="wdBtn">Withdraw</button>
      <a href="/earner/profile.html" style="display:block; text-align:center; margin-top:10px; font-size:13px; color:var(--accent); text-decoration:none;">Manage bank accounts →</a>
    </div>

    <div class="card" style="margin-bottom:20px; padding:20px;">
      <h3 style="margin-bottom:15px;">Withdrawal Requests</h3>
      <div id="wdList"><p style="color:var(--text-secondary); font-size:14px;">No withdrawals yet.</p></div>
    </div>

    <div class="card" style="padding:20px;">
      <h3 style="margin-bottom:15px;">Transaction History</h3>
      <div id="txList"><div class="skeleton skeleton-text"></div></div>
    </div>
  </div>

  <nav class="mobile-bottom-nav">
    <a href="/earner/dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></a>
    <a href="/earner/tasks.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>Tasks</span></a>
    <a href="/earner/wallet.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path></svg><span>Wallet</span></a>
    <a href="/earner/referrals.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path></svg><span>Refer</span></a>
    <a href="/earner/profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="7" r="4"></circle></svg><span>Profile</span></a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('earner');
      if (!profile) return;

      try {
        const balRes = await apiClient.request('wallet.js', { action: 'get_balance' });
        const w = balRes.data.wallet;
        document.getElementById('availBalance').textContent = formatCurrency(w.available_balance);
        document.getElementById('pendBalance').textContent = formatCurrency(w.pending_balance);
        document.getElementById('lockBalance').textContent = formatCurrency(w.locked_balance);
        document.getElementById('minWd').textContent = formatCurrency(balRes.data.min_withdrawal);

        const accRes = await apiClient.request('wallet.js', { action: 'get_bank_accounts' });
        const savedAccounts = accRes.data.accounts;
        const select = document.getElementById('bankSelect');
        if (savedAccounts.length === 0) {
          select.innerHTML = '<option value="">No saved accounts — add one in Settings → Payouts</option>';
          document.getElementById('wdBtn').disabled = true;
        } else {
          select.innerHTML = savedAccounts.map(a =>
            `<option value="${a.id}">${a.bank_name} ****${a.account_number.slice(-4)} ${a.is_default ? '(Default)' : ''}</option>`
          ).join('');
        }

        // Withdrawal requests with receipts
        const wdRes = await apiClient.request('wallet.js', { action: 'get_my_withdrawals' });
        const wds = wdRes.data.withdrawals;
        const wdList = document.getElementById('wdList');
        if (wds && wds.length > 0) {
          wdList.innerHTML = wds.map(x => `
            <div class="wd-row">
              <div>
                <div style="font-weight:600;">${formatCurrency(x.amount)} → ${x.bank_name}</div>
                <div style="font-size:12px; color:var(--text-secondary);">${formatDate(x.created_at)} • ${x.status}</div>
              </div>
              <a href="/receipt.html?type=withdrawal&id=${x.id}" class="btn btn-outline" style="padding:6px 12px; font-size:11px;">Receipt</a>
            </div>
          `).join('');
        }

        const txRes = await apiClient.request('wallet.js', { action: 'get_transactions' });
        const txs = txRes.data.transactions;
        const txList = document.getElementById('txList');
        if (!txs || txs.length === 0) {
          txList.innerHTML = '<p style="color:var(--text-secondary); font-size:14px;">No transactions yet.</p>';
        } else {
          txList.innerHTML = txs.map(t => `
            <div class="tx-row">
              <div>
                <div style="font-weight:600;">${t.transaction_type.replace(/_/g, ' ')}</div>
                <div style="font-size:12px; color:var(--text-secondary);">${formatDate(t.created_at)}</div>
              </div>
              <div style="font-weight:700; color:${t.direction === 'CREDIT' ? 'var(--success)' : 'var(--error)'};">
                ${t.direction === 'CREDIT' ? '+' : '-'}${formatCurrency(t.amount)}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    })();

    document.getElementById('wdBtn').addEventListener('click', async () => {
      const btn = document.getElementById('wdBtn');
      const accountId = document.getElementById('bankSelect').value;
      if (!accountId) { showToast('Add a bank account first in Settings → Payouts.', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Processing...';
      try {
        await apiClient.request('wallet.js', {
          action: 'request_withdrawal',
          amount: Number(document.getElementById('wdAmount').value),
          bank_account_id: accountId
        });
        showToast('Withdrawal requested!', 'success');
        setTimeout(() => window.location.reload(), 1500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Withdraw';
      }
    });
  </script>
</body>
</html>
