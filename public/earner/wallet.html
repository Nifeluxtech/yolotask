<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wallet - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/wallet.css" />
</head>
<body>
  <header class="app-header">
    <a href="/earner/dashboard.html" class="header-logo">← Back</a>
    <div class="header-user"><span id="userName">Earner</span></div>
  </header>

  <div class="dashboard-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1>My Wallet</h1>
      <button class="btn-primary" style="width:auto; padding:10px 20px; margin:0;" onclick="openWithdrawModal()">Withdraw Funds</button>
    </div>
    
    <div class="wallet-grid">
      <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount" id="availBal">₦0.00</div>
      </div>
      <div class="balance-card pending">
        <div class="balance-label">Pending (Withdrawals)</div>
        <div class="balance-amount" id="pendBal">₦0.00</div>
      </div>
      <div class="balance-card locked">
        <div class="balance-label">Locked</div>
        <div class="balance-amount" id="lockBal">₦0.00</div>
      </div>
    </div>

    <div class="ledger-container">
      <div class="ledger-header">
        <div class="ledger-title">Transaction History</div>
      </div>
      <div id="ledgerList" class="ledger-list">
        <div style="color:var(--text-secondary); text-align:center; padding:20px;">Loading transactions...</div>
      </div>
    </div>
  </div>

  <!-- Withdrawal Modal -->
  <div id="withdrawModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h2 style="margin-bottom:20px;">Request Withdrawal</h2>
      <p style="color:var(--text-secondary); font-size:14px; margin-bottom:20px;">Minimum withdrawal: ₦1,000. Processing time: 24-48 hours.</p>
      
      <form id="withdrawForm">
        <input type="number" id="wdAmount" class="modal-input" placeholder="Amount (₦)" min="1000" required />
        <input type="text" id="wdBank" class="modal-input" placeholder="Bank Name" required />
        <input type="text" id="wdAcctNum" class="modal-input" placeholder="Account Number" required />
        <input type="text" id="wdAcctName" class="modal-input" placeholder="Account Name" required />
        
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="button" class="btn-reject" style="flex:1;" onclick="closeWithdrawModal()">Cancel</button>
          <button type="submit" class="btn-approve" style="flex:1;">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('earner');
      if (!profile) return;
      document.getElementById('userName').textContent = profile.full_name;

      // Load Wallet Data
      try {
        const [balRes, ledRes] = await Promise.all([
          apiClient.request('wallet.js', { action: 'get_balance' }),
          apiClient.request('wallet.js', { action: 'get_ledger' })
        ]);

        const w = balRes.data.wallet;
        document.getElementById('availBal').textContent = formatCurrency(w.available_balance);
        document.getElementById('pendBal').textContent = formatCurrency(w.pending_balance);
        document.getElementById('lockBal').textContent = formatCurrency(w.locked_balance);

        const ledgerList = document.getElementById('ledgerList');
        if (ledRes.data.transactions.length === 0) {
          ledgerList.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:20px;">No transactions yet.</div>';
        } else {
          ledgerList.innerHTML = ledRes.data.transactions.map(t => `
            <div class="ledger-item">
              <div class="ledger-info">
                <div class="ledger-type">${t.transaction_type.replace(/_/g, ' ')}</div>
                <div class="ledger-date">${new Date(t.created_at).toLocaleDateString()} • ${t.status}</div>
              </div>
              <div class="ledger-amount ${t.direction.toLowerCase()}">
                ${t.direction === 'CREDIT' ? '+' : '-'}${formatCurrency(t.amount)}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    })();

    function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
    function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }

    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Processing...';

      try {
        await apiClient.request('wallet.js', {
          action: 'request_withdrawal',
          amount: parseFloat(document.getElementById('wdAmount').value),
          bank_name: document.getElementById('wdBank').value,
          account_number: document.getElementById('wdAcctNum').value,
          account_name: document.getElementById('wdAcctName').value
        });
        alert('Withdrawal request submitted! Admin will process it shortly.');
        closeWithdrawModal();
        window.location.reload();
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Submit Request';
      }
    });
  </script>
</body>
</html>
