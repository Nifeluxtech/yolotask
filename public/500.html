<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
    .error-box h1 { font-size: 120px; font-weight: 800; color: var(--error); margin: 0; line-height: 1; }
    .error-box h2 { font-size: 24px; margin: 20px 0 10px; }
    .error-box p { color: var(--text-secondary); margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>500</h1>
    <h2>Internal Server Error</h2>
    <p>Something went wrong on our end. Our team has been notified. Please try again later.</p>
    <a href="/" class="btn btn-primary">Go Back Home</a>
  </div>
</body>
</html>
