<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Proofs - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">ADVERTISER</span></div>
    <div style="font-weight:700; font-size:15px;">Review Proofs</div>
  </header>

  <main class="container" style="padding:22px 20px 120px; max-width:860px;">
    <div class="panel" style="border-color:var(--warning); background:var(--warning-bg); color:var(--warning); font-size:13px; margin-bottom:18px;">
      ⚠️ Pending proofs auto-approve (or escalate) after your approval window. Review promptly to protect your budget.
    </div>
    <div id="subList"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('tasks.js', { action: 'get_submissions' });
        const subs = res.data.submissions || [];
        const box = document.getElementById('subList');

        if (subs.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No pending submissions. Great job!</div>';
          return;
        }

        box.innerHTML = subs.map(s => `
          <div class="panel" id="sub-${s.id}">
            <div class="row-item" style="border:none; padding:0 0 10px;">
              <div>
                <div style="font-weight:700; font-size:15px;">${escapeHtml(s.campaign_title)}</div>
                <div class="row-sub">Worker: ${escapeHtml(s.earner?.full_name || 'Unknown')} (${escapeHtml(s.earner?.referral_code || 'N/A')}) • ${formatDate(s.created_at)}</div>
              </div>
              <span class="badge amber">PENDING</span>
            </div>
            <div style="background:var(--bg-primary); padding:12px; border-radius:10px; margin-bottom:14px; word-break:break-all;">
              <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">PROOF LINK</div>
              <a href="${escapeHtml(s.proof_url)}" target="_blank" style="color:var(--accent); text-decoration:none; font-size:13px;">${escapeHtml(s.proof_url)}</a>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
              <button class="btn btn-danger" style="padding:8px 16px; font-size:12px;" onclick="review('${s.id}','REJECTED',this)">Reject</button>
              <button class="btn btn-success" style="padding:8px 16px; font-size:12px;" onclick="review('${s.id}','APPROVED',this)">Approve & Pay</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('subList').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.review = async function (submissionId, reviewAction, btn) {
      if (reviewAction === 'APPROVED' && !confirm('Approving deducts funds from your wallet and pays the worker.')) return;
      if (reviewAction === 'REJECTED' && !confirm('Reject this proof? Funds return to your wallet.')) return;

      const old = btn.textContent;
      btn.disabled = true; btn.textContent = 'Processing...';
      try {
        await apiClient.request('tasks.js', { action: 'review_submission', submissionId, reviewAction });
        showToast(`Task ${reviewAction.toLowerCase()}.`, 'success');
        document.getElementById(`sub-${submissionId}`)?.remove();
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = old;
      }
    };
  </script>
</body>
</html>
