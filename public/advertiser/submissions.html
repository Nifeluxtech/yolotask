<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Submissions - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/tasks.css" />
</head>
<body>
  <header class="app-header">
    <a href="/advertiser/dashboard.html" class="header-logo">← Back</a>
    <div class="header-user"><span id="userName">Advertiser</span></div>
  </header>

  <div class="dashboard-container">
    <h1 style="margin-bottom:10px;">Task Submissions</h1>
    <p style="color:var(--text-secondary); margin-bottom:30px;">Review proof from workers. Approving will deduct funds from your wallet and pay the worker.</p>
    
    <div id="submissionsList">
      <div style="color:var(--text-secondary);">Loading submissions...</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      document.getElementById('userName').textContent = profile.full_name;

      const list = document.getElementById('submissionsList');

      try {
        const res = await apiClient.request('tasks.js', { action: 'get_submissions' });
        const submissions = res.data.submissions;

        if (submissions.length === 0) {
          list.innerHTML = '<div style="color:var(--text-secondary); text-align:center; padding:40px;">No pending submissions. Great job!</div>';
          return;
        }

        list.innerHTML = submissions.map(sub => `
          <div class="submission-card" id="sub-${sub.id}">
            <div class="submission-header">
              <div class="submission-campaign">${sub.campaign_title}</div>
              <div class="submission-date">${new Date(sub.created_at).toLocaleDateString()}</div>
            </div>
            <div style="font-size:13px; color:var(--text-secondary);">
              Worker: <span style="color:var(--text-primary);">${sub.earner.full_name}</span> (${sub.earner.referral_code})
            </div>
            <div class="submission-proof">
              <div style="font-size:12px; color:var(--text-secondary); margin-bottom:5px;">Proof Link:</div>
              <a href="${sub.proof_url}" target="_blank">${sub.proof_url}</a>
            </div>
            <div class="submission-actions">
              <button class="btn-reject" onclick="reviewTask('${sub.id}', 'REJECTED')">Reject</button>
              <button class="btn-approve" onclick="reviewTask('${sub.id}', 'APPROVED')">Approve & Pay</button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        list.innerHTML = `<div style="color:var(--error);">Error: ${err.message}</div>`;
      }
    })();

    async function reviewTask(submissionId, reviewActionStatus) {
      if (reviewActionStatus === 'APPROVED' && !confirm('Are you sure? This will deduct funds from your wallet and pay the worker.')) return;
      
      const btn = event.target;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = reviewActionStatus === 'APPROVED' ? 'Processing...' : 'Rejecting...';

      try {
        // FIX: We use 'reviewAction' instead of 'action' to prevent overwriting the API command
        await apiClient.request('tasks.js', { 
          action: 'review_submission', 
          submissionId: submissionId, 
          reviewAction: reviewActionStatus 
        });
        
        // Remove card from UI smoothly
        const card = document.getElementById(`sub-${submissionId}`);
        if(card) {
            card.style.opacity = '0.5';
            setTimeout(() => card.remove(), 500);
        }
        
        showToast(`Task ${reviewActionStatus.toLowerCase()} successfully.`, 'success');
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
