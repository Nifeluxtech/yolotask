<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Campaign - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .plat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .plat-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg-primary); cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-secondary); transition: .15s; text-align: center; }
    .plat-opt img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; }
    .plat-opt.selected { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <a href="/advertiser/campaigns.html" style="color:var(--accent); text-decoration:none; font-weight:600;">← Campaigns</a>
    <div style="font-weight:700; font-size:15px;">New Campaign</div>
  </header>

  <main class="container" style="padding:22px 20px 120px; max-width:760px;">
    <div class="panel">
      <label class="f-label">Platform (where the task happens)</label>
      <div class="plat-grid" id="platGrid"><div style="font-size:12px; color:var(--text-secondary);">Loading platforms...</div></div>

      <label class="f-label">Campaign Title</label>
      <input type="text" id="title" class="f-input" placeholder="e.g. Follow our Instagram page" />

      <label class="f-label">Task Type (the action workers perform)</label>
      <select id="task_type_id" class="f-input"><option value="">Loading...</option></select>

      <label class="f-label">Instructions for Workers</label>
      <textarea id="instructions" class="f-input" style="min-height:110px;" placeholder="Step 1: Click the link..."></textarea>

      <label class="f-label">Destination Link</label>
      <input type="url" id="destination_link" class="f-input" placeholder="https://..." />

      <label class="f-label">Number of Workers</label>
      <input type="number" id="target_quantity" class="f-input" min="1" max="100000" placeholder="e.g. 100" />

      <div class="toggle-row">
        <div>
          <div style="font-weight:600; font-size:14px;">Premium Targeting</div>
          <div style="font-size:12px; color:var(--text-secondary);">Target interests/gender — costs 2x per task.</div>
        </div>
        <label class="switch"><input type="checkbox" id="is_targeted" /><span class="slider"></span></label>
      </div>

      <div id="targetingOptions" style="display:none;">
        <label class="f-label">Target Gender (optional)</label>
        <div style="display:flex; gap:15px; margin-bottom:14px;">
          <label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" name="gender" value="male" style="width:auto;" /> Male</label>
          <label style="display:flex; align-items:center; gap:6px; font-size:13px;"><input type="checkbox" name="gender" value="female" style="width:auto;" /> Female</label>
        </div>
        <label class="f-label">Target Interests (at least one)</label>
        <div id="interestsContainer" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; max-height:200px; overflow-y:auto; margin-bottom:14px;"></div>
      </div>
    </div>

    <div class="panel" style="border-color:var(--accent); display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:13px; color:var(--text-secondary);">Estimated Total Budget<br/><span style="font-size:11px;">Includes platform margin. No hidden fees.</span></div>
      <div style="font-size:24px; font-weight:800; color:var(--accent);" id="budgetDisplay">₦0.00</div>
    </div>

    <button class="btn btn-primary w-full" id="submitBtn">Save as Draft</button>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let selectedPlatformId = null; // null = "Other"

    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;

      try {
        const [refRes, setRes] = await Promise.all([
          apiClient.request('campaigns.js', { action: 'get_reference_data' }),
          apiClient.request('campaigns.js', { action: 'get_advertiser_settings' })
        ]);

        const taskTypes = refRes.data.task_types || [];
        const interests = refRes.data.interests || [];
        const platforms = refRes.data.platforms || [];
        const defaults = (setRes.data.settings && setRes.data.settings.campaign_defaults) || {};

        // Platform picker (logo grid + Other)
        const grid = document.getElementById('platGrid');
        grid.innerHTML = platforms.map(p => `
          <div class="plat-opt" data-id="${p.id}" onclick="selectPlatform('${p.id}', this)">
            <img src="${p.logo_url || '/icons/icon.svg'}" onerror="this.src='/icons/icon.svg'" alt="" />
            <span>${escapeHtml(p.name)}</span>
          </div>
        `).join('') + `
          <div class="plat-opt selected" data-id="" onclick="selectPlatform(null, this)">
            <img src="/icons/icon.svg" alt="" />
            <span>Other</span>
          </div>`;

        // Task types (+ guaranteed "Other Task" row exists in DB)
        const typeSelect = document.getElementById('task_type_id');
        typeSelect.innerHTML = '<option value="">Select task type...</option>';
        taskTypes.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = `${t.name} (₦${t.base_advertiser_cost} base / ₦${t.premium_advertiser_cost} premium)`;
          opt.dataset.base = t.base_advertiser_cost;
          opt.dataset.premium = t.premium_advertiser_cost;
          typeSelect.appendChild(opt);
        });

        const intBox = document.getElementById('interestsContainer');
        intBox.innerHTML = interests.map(i =>
          `<label style="display:flex; align-items:center; gap:6px; font-size:12px; background:var(--bg-primary); border:1px solid var(--border); border-radius:8px; padding:8px;"><input type="checkbox" name="interest" value="${i.id}" style="width:auto;" /> ${escapeHtml(i.name)}</label>`
        ).join('');

        if (defaults.task_type_id) typeSelect.value = defaults.task_type_id;
        if (defaults.is_targeted) document.getElementById('is_targeted').checked = true;
        (defaults.interest_ids || []).forEach(id => {
          const cb = document.querySelector(`input[name="interest"][value="${id}"]`);
          if (cb) cb.checked = true;
        });

        updateBudget();
      } catch (err) {
        showToast('Failed to load form data: ' + err.message, 'error');
      }
    })();

    window.selectPlatform = function (id, el) {
      selectedPlatformId = id;
      document.querySelectorAll('.plat-opt').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    };

    function updateBudget() {
      const typeSelect = document.getElementById('task_type_id');
      const qty = parseInt(document.getElementById('target_quantity').value) || 0;
      const isTargeted = document.getElementById('is_targeted').checked;
      document.getElementById('targetingOptions').style.display = isTargeted ? 'block' : 'none';
      if (typeSelect.value && qty > 0) {
        const opt = typeSelect.options[typeSelect.selectedIndex];
        const cost = isTargeted ? parseFloat(opt.dataset.premium) : parseFloat(opt.dataset.base);
        document.getElementById('budgetDisplay').textContent = formatCurrency(cost * qty);
      } else {
        document.getElementById('budgetDisplay').textContent = formatCurrency(0);
      }
    }

    document.getElementById('task_type_id').addEventListener('change', updateBudget);
    document.getElementById('target_quantity').addEventListener('input', updateBudget);
    document.getElementById('is_targeted').addEventListener('change', updateBudget);

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating...';
      const isTargeted = document.getElementById('is_targeted').checked;
      try {
        await apiClient.request('campaigns.js', {
          action: 'create',
          title: document.getElementById('title').value,
          task_type_id: document.getElementById('task_type_id').value,
          instructions: document.getElementById('instructions').value,
          destination_link: document.getElementById('destination_link').value,
          is_targeted: isTargeted,
          target_quantity: parseInt(document.getElementById('target_quantity').value),
          platform_id: selectedPlatformId,
          target_genders: isTargeted ? Array.from(document.querySelectorAll('input[name="gender"]:checked')).map(cb => cb.value) : [],
          target_interest_ids: isTargeted ? Array.from(document.querySelectorAll('input[name="interest"]:checked')).map(cb => cb.value) : []
        });
        showToast('Campaign draft created!', 'success');
        setTimeout(() => window.location.href = '/advertiser/campaigns.html', 900);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Save as Draft';
      }
    });
  </script>
</body>
</html>
