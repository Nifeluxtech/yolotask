<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - YOLOTASK Advertiser</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">ADVERTISER</span></div>
    <div style="font-weight:700; font-size:15px;">Wallet</div>
  </header>

  <main class="container" style="padding:22px 20px 120px; max-width:860px;">
    <div style="background:linear-gradient(135deg, var(--accent), #4338ca); border-radius:var(--radius-lg); padding:26px; color:#fff; margin-bottom:18px;">
      <div style="font-size:13px; opacity:.9;">Available Balance</div>
      <div style="font-size:34px; font-weight:800; margin:4px 0;" id="availBalance">₦0.00</div>
      <div style="font-size:13px; opacity:.9;">Locked in live campaigns: <strong id="lockBalance">₦0.00</strong></div>
    </div>

    <div class="panel">
      <h3>Fund Your Wallet</h3>
      <label class="f-label">Amount (₦)</label>
      <input type="number" id="topupAmount" class="f-input" min="100" placeholder="e.g. 10000" />
      <button class="btn btn-primary w-full" id="topupBtn">Pay with Paystack</button>
    </div>

    <div class="panel">
      <h3>Top-up History</h3>
      <div id="topupList"><div class="skeleton skeleton-text"></div></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // ⚠️ PASTE YOUR REAL PAYSTACK PUBLIC KEY HERE (pk_test_... or pk_live_...)
    const PAYSTACK_PUBLIC_KEY = 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';

    let me = null;

    (async () => {
      me = await checkAuthAndRedirect('advertiser');
      if (!me) return;

      try {
        const balRes = await apiClient.request('wallet.js', { action: 'get_balance' });
        document.getElementById('availBalance').textContent = formatCurrency(balRes.data.wallet.available_balance);
        document.getElementById('lockBalance').textContent = formatCurrency(balRes.data.wallet.locked_balance);

        const histRes = await apiClient.request('payments.js', { action: 'get_topups' });
        const topups = histRes.data.topups || [];
        const list = document.getElementById('topupList');

        if (topups.length === 0) {
          list.innerHTML = '<div style="color:var(--text-secondary); font-size:13px;">No top-ups yet.</div>';
        } else {
          list.innerHTML = topups.map(t => `
            <div class="row-item">
              <div>
                <div style="font-weight:700;">${formatCurrency(t.amount)}</div>
                <div class="row-sub">${formatDate(t.created_at)} • ${t.status}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge ${t.status === 'SUCCESS' ? 'green' : t.status === 'PENDING' ? 'amber' : 'red'}">${t.status}</span>
                <a href="/receipt.html?type=topup&id=${t.id}" class="btn btn-outline" style="padding:6px 12px; font-size:11px;">Receipt</a>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    })();

    document.getElementById('topupBtn').addEventListener('click', async () => {
      const amount = Number(document.getElementById('topupAmount').value);
      if (!amount || amount < 100) { showToast('Minimum top-up is ₦100.', 'error'); return; }

      const btn = document.getElementById('topupBtn');
      btn.disabled = true; btn.textContent = 'Initializing...';

      try {
        const res = await apiClient.request('payments.js', { action: 'initialize_topup', amount });

        const handler = PaystackPop.setupHandler({
          key: PAYSTACK_PUBLIC_KEY,
          reference: res.data.reference,
          email: me.email,
          amount: amount * 100,
          onClose: () => {
            btn.disabled = false; btn.textContent = 'Pay with Paystack';
            showToast('Payment window closed.', 'warning');
          },
          callback: async (response) => {
            try {
              await apiClient.request('payments.js', { action: 'verify_topup', reference: response.reference });
              showToast('Wallet funded successfully!', 'success');
              setTimeout(() => window.location.reload(), 1200);
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false; btn.textContent = 'Pay with Paystack';
            }
          }
        });
        handler.openIframe();
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Pay with Paystack';
      }
    });
  </script>
</body>
</html>
