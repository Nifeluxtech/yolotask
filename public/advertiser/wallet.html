<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - YOLOTASK Advertiser</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/mobile-nav.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .balance-card { background: linear-gradient(135deg, var(--accent), #0077aa); border-radius: var(--radius-lg); padding: 30px; color: #fff; margin-bottom: 20px; }
    .balance-label { font-size: 13px; opacity: 0.85; }
    .balance-value { font-size: 36px; font-weight: 800; margin: 5px 0; }
    .balance-sub { display: flex; gap: 20px; font-size: 13px; opacity: 0.9; }
    .settings-select { width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); margin-bottom: 15px; }
    .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; gap: 10px; flex-wrap: wrap; }
    .tx-row:last-child { border-bottom: none; }
  </style>
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
  <header class="flex justify-between items-center" style="padding: 15px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);">
    <a href="/advertiser/dashboard.html" style="color:var(--accent); text-decoration:none; font-weight:600;">← Back</a>
    <div style="font-weight:800; color:var(--accent);">Wallet</div>
  </header>

  <div class="container" style="padding: 30px 20px; max-width: 640px;">
    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-value" id="availBalance">₦0.00</div>
      <div class="balance-sub">
        <span>Locked in campaigns: <strong id="lockBalance">₦0.00</strong></span>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px; padding:20px;">
      <h3 style="margin-bottom:15px;">Fund Your Wallet</h3>
      <label style="display:block; margin-bottom:8px; font-size:14px; color:var(--text-secondary);">Amount (₦)</label>
      <input type="number" id="topupAmount" class="settings-select" placeholder="e.g. 10000" min="100" />
      <button class="btn btn-primary w-full" id="topupBtn">Pay with Paystack</button>
    </div>

    <div class="card" style="padding:20px;">
      <h3 style="margin-bottom:15px;">Top-up History</h3>
      <div id="topupList"><div class="skeleton skeleton-text"></div></div>
    </div>
  </div>

  <nav class="mobile-bottom-nav">
    <a href="/advertiser/dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></a>
    <a href="/advertiser/campaigns.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>Campaigns</span></a>
    <a href="/advertiser/submissions.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"></path></svg><span>Reviews</span></a>
    <a href="/advertiser/wallet.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path></svg><span>Wallet</span></a>
    <a href="/advertiser/profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="7" r="4"></circle></svg><span>Profile</span></a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    // REPLACE with your Paystack PUBLIC key
    const PAYSTACK_PUBLIC_KEY = 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';

    let me = null;

    (async () => {
      me = await checkAuthAndRedirect('advertiser');
      if (!me) return;

      try {
        const balRes = await apiClient.request('wallet.js', { action: 'get_balance' });
        document.getElementById('availBalance').textContent = formatCurrency(balRes.data.wallet.available_balance);
        document.getElementById('lockBalance').textContent = formatCurrency(balRes.data.wallet.locked_balance);

        const histRes = await apiClient.request('payments.js', { action: 'get_topups' });
        const topups = histRes.data.topups || [];
        const list = document.getElementById('topupList');

        if (topups.length === 0) {
          list.innerHTML = '<p style="color:var(--text-secondary); font-size:14px;">No top-ups yet.</p>';
        } else {
          list.innerHTML = topups.map(t => `
            <div class="tx-row">
              <div>
                <div style="font-weight:600;">${formatCurrency(t.amount)}</div>
                <div style="font-size:12px; color:var(--text-secondary);">${formatDate(t.created_at)} • ${t.status}</div>
              </div>
              <a href="/receipt.html?type=topup&id=${t.id}" class="btn btn-outline" style="padding:6px 12px; font-size:11px;">Receipt</a>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    })();

    document.getElementById('topupBtn').addEventListener('click', async () => {
      const amount = Number(document.getElementById('topupAmount').value);
      if (!amount || amount < 100) { showToast('Minimum top-up is ₦100.', 'error'); return; }

      const btn = document.getElementById('topupBtn');
      btn.disabled = true; btn.textContent = 'Initializing...';

      try {
        const res = await apiClient.request('payments.js', { action: 'initialize_topup', amount });

        const handler = PaystackPop.setupHandler({
          key: PAYSTACK_PUBLIC_KEY,
          reference: res.data.reference,
          email: me.email,
          amount: amount * 100,
          onClose: () => {
            btn.disabled = false; btn.textContent = 'Pay with Paystack';
            showToast('Payment window closed.', 'warning');
          },
          callback: async (response) => {
            try {
              await apiClient.request('payments.js', { action: 'verify_topup', reference: response.reference });
              showToast('Wallet funded successfully!', 'success');
              setTimeout(() => window.location.reload(), 1200);
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false; btn.textContent = 'Pay with Paystack';
            }
          }
        });
        handler.openIframe();
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Pay with Paystack';
      }
    });
  </script>
</body>
</html>
