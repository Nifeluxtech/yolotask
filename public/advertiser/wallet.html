<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advertiser Wallet - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/wallet.css" />
</head>
<body>
  <header class="app-header">
    <a href="/advertiser/dashboard.html" class="header-logo">← Back</a>
    <div class="header-user"><span id="userName">Advertiser</span></div>
  </header>

  <div class="dashboard-container">
    <h1 style="margin-bottom:20px;">Fund Your Wallet</h1>
    <p style="color:var(--text-secondary); margin-bottom:30px;">Securely fund your wallet to create and run campaigns. All deposits are verified via Paystack.</p>
    
    <div class="wallet-grid">
      <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount" id="availBal">₦0.00</div>
      </div>
      <div class="balance-card locked">
        <div class="balance-label">Locked in Campaigns</div>
        <div class="balance-amount" id="lockBal">₦0.00</div>
      </div>
    </div>

    <div class="ledger-container" style="max-width:500px; margin-top:30px;">
      <h3 style="margin-bottom:15px;">Quick Deposit</h3>
      <form id="depositForm">
        <div class="form-group">
          <label style="color:var(--text-secondary); font-size:14px; margin-bottom:8px; display:block;">Amount ()</label>
          <input type="number" id="depositAmount" class="modal-input" placeholder="e.g. 5000" min="100" required />
        </div>
        <button type="submit" class="btn-primary" id="payBtn">Proceed to Paystack</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      document.getElementById('userName').textContent = profile.full_name;

      // Check URL for successful payment return
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('status') === 'success') {
        alert('Payment successful! Your wallet has been credited.');
        window.history.replaceState({}, document.title, "/advertiser/wallet.html");
      }

      // Load Balance
      try {
        const res = await apiClient.request('wallet.js', { action: 'get_balance' });
        const w = res.data.wallet;
        document.getElementById('availBal').textContent = formatCurrency(w.available_balance);
        document.getElementById('lockBal').textContent = formatCurrency(w.locked_balance);
      } catch (err) { console.error(err); }
    })();

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('payBtn');
      btn.disabled = true; btn.textContent = 'Initializing...';

      try {
        const amount = parseFloat(document.getElementById('depositAmount').value);
        const res = await apiClient.request('payments.js', { action: 'initialize', amount });
        
        // Redirect to Paystack secure checkout
        window.location.href = res.data.authorization_url;
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.textContent = 'Proceed to Paystack';
      }
    });
  </script>
</body>
</html>
