<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <style>
    .balance-card { background: linear-gradient(135deg, var(--accent), #4338ca); border-radius: var(--radius-lg); padding: 26px; color: #fff; margin-bottom: 18px; }
    .hist-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .hist-row:last-child { border-bottom: none; }
    .gw-badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 10px; background: var(--accent-glow); color: var(--accent); }
  </style>
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">ADVERTISER</span></div>
    <div style="font-weight:700; font-size:15px;">Wallet</div>
  </header>

  <main class="container" style="padding:22px 18px 120px; max-width:760px;">
    <div class="balance-card">
      <div style="font-size:13px; opacity:.85;">Available Balance</div>
      <div style="font-size:34px; font-weight:800; margin:4px 0;" id="availBal">₦0.00</div>
      <div style="font-size:13px; opacity:.85;">Locked in live campaigns: <strong id="lockedBal">₦0.00</strong></div>
    </div>

    <div class="panel">
      <h3>Fund Your Wallet</h3>
      <label class="f-label">Amount (₦)</label>
      <input type="number" id="amountInput" class="f-input" min="100" placeholder="e.g. 10000" />
      <button class="btn btn-primary w-full" id="payBtn">Pay Now</button>
      <div style="font-size:11px; color:var(--text-muted); margin-top:8px; text-align:center;">Secure checkout via <span id="gwLabel">Paystack</span></div>
    </div>

    <div class="panel">
      <h3>Top-up History</h3>
      <div id="topupList"><div class="skeleton skeleton-text"></div></div>
    </div>
  </main>

  <!-- Paystack Inline v2 (only used when gateway=paystack) -->
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let publicKey = null;
    let myEmail = '';

    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      myEmail = profile.email || '';

      try {
        const k = await apiClient.request('payments.js', { action: 'get_public_key' });
        publicKey = k.data.public_key || null;
      } catch (e) {}
      try {
        const g = await apiClient.request('mgmpay.js', { action: 'get_gateway_settings' });
        document.getElementById('gwLabel').textContent = g.data.settings.deposit_gateway === 'mgmpay' ? 'MGM Pay' : 'Paystack';
      } catch (e) {}

      handleReturnReference();
      load();
    })();

    async function load() {
      try {
        const [balRes, topRes] = await Promise.all([
          apiClient.request('wallet.js', { action: 'get_balance' }),
          apiClient.request('payments.js', { action: 'get_topups' })
        ]);
        document.getElementById('availBal').textContent = formatCurrency(balRes.data.wallet.available_balance);
        document.getElementById('lockedBal').textContent = formatCurrency(balRes.data.wallet.locked_balance);

        const list = topRes.data.topups || [];
        document.getElementById('topupList').innerHTML = list.length === 0
          ? '<div style="color:var(--text-secondary); font-size:13px;">No top-ups yet.</div>'
          : list.map(t => `
            <div class="hist-row">
              <div>
                <div style="font-weight:800; font-size:16px;">${formatCurrency(t.amount)} <span class="gw-badge">${t.gateway === 'mgmpay' ? 'MGM Pay' : 'Paystack'}</span></div>
                <div style="font-size:12px; color:var(--text-secondary);">${formatDate(t.created_at)} • ${t.status}</div>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <span class="badge ${t.status === 'SUCCESS' ? 'green' : t.status === 'PENDING' ? 'amber' : 'red'}">${t.status}</span>
                <a class="btn btn-outline" style="padding:6px 12px; font-size:11px;" href="/receipt.html?type=topup&id=${t.id}">Receipt</a>
              </div>
            </div>`).join('');
      } catch (err) {
        document.getElementById('topupList').innerHTML = `<div style="color:var(--error); font-size:13px;">${escapeHtml(err.message)}</div>`;
      }
    }

    function handleReturnReference() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('trxref') || params.get('reference');
      if (!ref) return;
      history.replaceState(null, '', window.location.pathname);
      verify(ref);
    }

    async function verify(reference) {
      try {
        const res = await apiClient.request('payments.js', { action: 'verify_topup', reference });
        showToast(res.message || 'Top-up credited!', 'success');
        load();
      } catch (err) {
        showToast(err.message, 'warning');
        load();
      }
    }

    document.getElementById('payBtn').addEventListener('click', async () => {
      const btn = document.getElementById('payBtn');
      const amount = Number(document.getElementById('amountInput').value);
      if (!amount || amount < 100) { showToast('Minimum top-up is ₦100.', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Starting checkout...';
      try {
        const init = await apiClient.request('payments.js', { action: 'initialize_topup', amount });
        const reference = init.data.reference;

        // ---------- MGM Pay: redirect to cashier ----------
        if (init.data.gateway === 'mgmpay') {
          window.location.href = init.data.redirect_url;
          return;
        }

        // ---------- Paystack inline (v2 → v1 → redirect fallback) ----------
        if (!publicKey) { showToast('Payment key not configured.', 'error'); btn.disabled = false; btn.textContent = 'Pay Now'; return; }

        const afterSuccess = (ref) => verify(ref || reference);
        const afterClose = () => { showToast('Checkout closed. If you paid, funds appear automatically.', 'warning'); load(); };

        if (typeof PaystackPop !== 'undefined' && typeof PaystackPop.setupHandler === 'function') {
          PaystackPop.setupHandler({
            reference, publicKey, email: myEmail, amount: Math.round(amount * 100),
            onSuccess: (txn) => afterSuccess(txn && txn.reference),
            onCancel: afterClose,
            onError: () => { showToast('Checkout error.', 'error'); load(); }
          });
          PaystackPop.openIframe();
        } else if (typeof PaystackPop !== 'undefined' && typeof PaystackPop.setup === 'function') {
          const handler = PaystackPop.setup({
            reference, key: publicKey, email: myEmail, amount: Math.round(amount * 100),
            callback: (resp) => afterSuccess(resp && resp.reference),
            onClose: afterClose
          });
          handler.openIframe();
        } else {
          window.location.href = init.data.authorization_url;
        }
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Pay Now';
      }
    });
  </script>
</body>
</html>
