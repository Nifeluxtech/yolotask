<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Campaigns - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">ADVERTISER</span></div>
    <a href="/advertiser/create-campaign.html" class="btn btn-primary" style="padding:8px 16px; font-size:13px;">+ New</a>
  </header>

  <main class="container" style="padding:22px 20px 120px; max-width:860px;">
    <div id="campaignList"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
  </main>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px;">Edit Campaign</h3>
      <input type="hidden" id="editId" />
      <label class="f-label">Title</label>
      <input type="text" id="editTitle" class="f-input" />
      <label class="f-label">Instructions</label>
      <textarea id="editInstructions" class="f-input" style="min-height:100px;"></textarea>
      <label class="f-label">Destination Link</label>
      <input type="url" id="editLink" class="f-input" />
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-outline" style="padding:9px 16px; font-size:13px;" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="padding:9px 16px; font-size:13px;" id="saveEditBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      load();
    })();

    async function load() {
      try {
        const res = await apiClient.request('campaigns.js', { action: 'get_list' });
        const camps = res.data.campaigns || [];
        const box = document.getElementById('campaignList');

        if (camps.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No campaigns yet. Create your first one!</div>';
          return;
        }

        box.innerHTML = camps.map(c => {
          let actions = '';
          if (c.status === 'DRAFT') actions = `<button class="btn btn-primary" style="padding:7px 14px; font-size:12px;" onclick="submitCamp('${c.id}')">Submit for Review</button>`;
          else if (c.status === 'LIVE') actions = `
            <button class="btn btn-outline" style="padding:7px 12px; font-size:12px;" onclick="openEdit('${c.id}', '${escapeHtml(c.title).replace(/'/g, "\\'")}', '${escapeHtml(c.instructions || '').replace(/'/g, "\\'")}', '${escapeHtml(c.destination_link || '')}')">Edit</button>
            <button class="btn" style="padding:7px 12px; font-size:12px; background:var(--warning); color:#000;" onclick="changeStatus('${c.id}','PAUSED')">Pause</button>
            <button class="btn btn-danger" style="padding:7px 12px; font-size:12px;" onclick="changeStatus('${c.id}','CANCELLED')">Cancel</button>`;
          else if (c.status === 'PAUSED') actions = `
            <button class="btn btn-success" style="padding:7px 14px; font-size:12px;" onclick="changeStatus('${c.id}','LIVE')">Resume</button>
            <button class="btn btn-danger" style="padding:7px 12px; font-size:12px;" onclick="changeStatus('${c.id}','CANCELLED')">Cancel</button>`;
          else if (c.status === 'SUBMITTED') actions = '<span class="badge cyan">Awaiting Admin</span>';
          else if (c.status === 'COMPLETED') actions = '<span class="badge green">Finished</span>';
          else actions = `<span class="badge ${c.status === 'REJECTED' ? 'red' : 'gray'}">${c.status}</span>`;

          const pct = c.target_quantity ? Math.round((c.completed_quantity / c.target_quantity) * 100) : 0;
          return `
            <div class="panel">
              <div class="row-item" style="border:none; padding:0 0 10px;">
                <div style="flex:1; min-width:0;">
                  <div style="font-weight:700; font-size:15px;">${escapeHtml(c.title)}</div>
                  <div class="row-sub">${escapeHtml(c.task_types?.name || 'Task')} • ${formatCurrency(c.total_budget)} • ${c.completed_quantity}/${c.target_quantity} workers</div>
                </div>
                <span class="badge ${c.status === 'LIVE' ? 'green' : c.status === 'PAUSED' ? 'amber' : c.status === 'REJECTED' ? 'red' : c.status === 'COMPLETED' ? 'gray' : 'cyan'}">${c.status}</span>
              </div>
              <div style="height:6px; background:var(--bg-primary); border-radius:4px; margin-bottom:14px; overflow:hidden;">
                <div style="height:100%; width:${pct}%; background:var(--accent); border-radius:4px;"></div>
              </div>
              <div style="display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">${actions}</div>
            </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('campaignList').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    }

    window.submitCamp = async function (id) {
      if (!confirm('Submit this campaign for admin review?')) return;
      try {
        await apiClient.request('campaigns.js', { action: 'submit', campaignId: id });
        showToast('Submitted for review!', 'success');
        setTimeout(() => load(), 800);
      } catch (e) { showToast(e.message, 'error'); }
    };

    window.changeStatus = async function (id, status) {
      const msg = status === 'CANCELLED' ? 'Cancel campaign and refund remaining budget to wallet?' : `Change status to ${status}?`;
      if (!confirm(msg)) return;
      try {
        await apiClient.request('campaigns.js', { action: 'change_status', campaignId: id, newStatus: status });
        showToast(`Campaign ${status.toLowerCase()}.`, 'success');
        setTimeout(() => load(), 800);
      } catch (e) { showToast(e.message, 'error'); }
    };

    window.openEdit = function (id, title, instructions, link) {
      document.getElementById('editId').value = id;
      document.getElementById('editTitle').value = title;
      document.getElementById('editInstructions').value = instructions;
      document.getElementById('editLink').value = link;
      document.getElementById('editModal').classList.add('active');
    };
    window.closeModal = function () { document.getElementById('editModal').classList.remove('active'); };

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      try {
        await apiClient.request('campaigns.js', {
          action: 'update_campaign',
          campaignId: document.getElementById('editId').value,
          title: document.getElementById('editTitle').value,
          instructions: document.getElementById('editInstructions').value,
          destination_link: document.getElementById('editLink').value
        });
        showToast('Campaign updated!', 'success');
        closeModal();
        setTimeout(() => load(), 800);
      } catch (e) { showToast(e.message, 'error'); }
    });
  </script>
</body>
</html>
