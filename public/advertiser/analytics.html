<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics - YOLOTASK Advertiser</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/ui-components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <header class="flex justify-between items-center" style="padding:15px 20px;">
    <div class="yolo-brand" style="font-size:20px;">YOLOTASK <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">ADVERTISER</span></div>
    <div style="font-weight:700; font-size:15px;">Analytics</div>
  </header>

  <main class="container" style="padding:22px 20px 120px; max-width:860px;">
    <div class="stat-grid" id="summaryGrid"><div class="stat-card"><div class="skeleton skeleton-text"></div></div></div>
    <div id="campCards"><div class="panel"><div class="skeleton skeleton-card"></div></div></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;

      try {
        const res = await apiClient.request('campaigns.js', { action: 'get_list' });
        const camps = res.data.campaigns || [];

        const totalSpend = camps.reduce((s, c) => s + (Number(c.total_budget) - Number(c.remaining_budget || 0)), 0);
        const totalDone = camps.reduce((s, c) => s + Number(c.completed_quantity || 0), 0);
        const totalSlots = camps.reduce((s, c) => s + Number(c.target_quantity || 0), 0);
        const avgRate = totalSlots ? Math.round((totalDone / totalSlots) * 100) : 0;

        document.getElementById('summaryGrid').innerHTML = `
          <div class="stat-card"><div class="stat-lbl">Total Spent</div><div class="stat-val" style="font-size:22px;">${formatCurrency(totalSpend)}</div></div>
          <div class="stat-card"><div class="stat-lbl">Tasks Completed</div><div class="stat-val good">${totalDone}</div></div>
          <div class="stat-card"><div class="stat-lbl">Avg Completion</div><div class="stat-val">${avgRate}%</div></div>
        `;

        const box = document.getElementById('campCards');
        if (camps.length === 0) {
          box.innerHTML = '<div class="panel" style="text-align:center; color:var(--text-secondary); padding:40px;">No campaign data yet.</div>';
          return;
        }

        box.innerHTML = camps.map(c => {
          const pct = c.target_quantity ? Math.round((c.completed_quantity / c.target_quantity) * 100) : 0;
          const spent = Number(c.total_budget) - Number(c.remaining_budget || 0);
          return `
            <div class="panel">
              <div class="row-item" style="border:none; padding:0 0 10px;">
                <div style="flex:1; min-width:0;">
                  <div style="font-weight:700; font-size:15px;">${escapeHtml(c.title)}</div>
                  <div class="row-sub">${escapeHtml(c.task_types?.name || 'Task')} • created ${formatDate(c.created_at)}</div>
                </div>
                <span class="badge ${c.status === 'LIVE' ? 'green' : c.status === 'PAUSED' ? 'amber' : c.status === 'REJECTED' ? 'red' : c.status === 'COMPLETED' ? 'gray' : 'cyan'}">${c.status}</span>
              </div>
              <div style="height:8px; background:var(--bg-primary); border-radius:5px; overflow:hidden; margin-bottom:12px;">
                <div style="height:100%; width:${pct}%; background:linear-gradient(90deg, var(--accent), #4338ca); border-radius:5px;"></div>
              </div>
              <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; font-size:12px; color:var(--text-secondary); text-align:center;">
                <div><strong style="display:block; font-size:15px; color:var(--text-primary);">${c.completed_quantity}/${c.target_quantity}</strong>workers</div>
                <div><strong style="display:block; font-size:15px; color:var(--text-primary);">${pct}%</strong>completion</div>
                <div><strong style="display:block; font-size:15px; color:var(--text-primary);">${formatCurrency(spent)}</strong>spent</div>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('campCards').innerHTML = `<div class="panel" style="color:var(--error);">${escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
