<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Analytics - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/analytics.css" />
</head>
<body>
  <header class="app-header">
    <a href="/advertiser/campaigns.html" class="header-logo">← Back</a>
    <div class="header-user"><span id="userName">Advertiser</span></div>
  </header>

  <div class="dashboard-container">
    <h1 style="margin-bottom:10px;">Campaign Performance</h1>
    <p style="color:var(--text-secondary); margin-bottom:30px;" id="campaignTitle">Loading campaign...</p>
    
    <!-- Key Metrics -->
    <div class="analytics-grid">
      <div class="metric-card">
        <div class="metric-value" id="metricSpent">₦0</div>
        <div class="metric-label">Total Spent</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metricWorkers">0</div>
        <div class="metric-label">Workers Reached</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metricRate">0%</div>
        <div class="metric-label">Approval Rate</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metricBudget">₦0</div>
        <div class="metric-label">Remaining Budget</div>
      </div>
    </div>

    <!-- Submission Breakdown Chart -->
    <div class="chart-container">
      <div class="chart-title">Submission Breakdown</div>
      <div class="bar-chart" id="submissionChart">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Campaign Progress -->
    <div class="chart-container">
      <div class="chart-title">Campaign Progress</div>
      <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:10px;">
        <span style="color:var(--text-secondary);">Completion Rate</span>
        <span style="font-weight:600;" id="progressText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:10px; text-align:center;">
        <span id="completedCount">0</span> of <span id="targetCount">0</span> workers completed
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const profile = await checkAuthAndRedirect('advertiser');
      if (!profile) return;
      document.getElementById('userName').textContent = profile.full_name;

      const urlParams = new URLSearchParams(window.location.search);
      const campaignId = urlParams.get('id');

      if (!campaignId) {
        window.location.href = '/advertiser/campaigns.html';
        return;
      }

      try {
        const res = await apiClient.request('campaigns.js', { action: 'get_analytics', campaignId });
        const { campaign, metrics } = res.data.analytics;

        document.getElementById('campaignTitle').textContent = campaign.title;
        document.getElementById('metricSpent').textContent = formatCurrency(metrics.total_spent);
        document.getElementById('metricWorkers').textContent = metrics.approved;
        document.getElementById('metricRate').textContent = metrics.approval_rate + '%';
        document.getElementById('metricBudget').textContent = formatCurrency(campaign.remaining_budget);

        // Render Chart
        const maxVal = Math.max(metrics.approved, metrics.rejected, metrics.pending, 1);
        const chart = document.getElementById('submissionChart');
        chart.innerHTML = `
          <div class="bar-group">
            <div class="bar approved" style="height: ${(metrics.approved / maxVal) * 100}%;">
              <span class="bar-value">${metrics.approved}</span>
            </div>
            <div class="bar-label">Approved</div>
          </div>
          <div class="bar-group">
            <div class="bar rejected" style="height: ${(metrics.rejected / maxVal) * 100}%;">
              <span class="bar-value">${metrics.rejected}</span>
            </div>
            <div class="bar-label">Rejected</div>
          </div>
          <div class="bar-group">
            <div class="bar pending" style="height: ${(metrics.pending / maxVal) * 100}%;">
              <span class="bar-value">${metrics.pending}</span>
            </div>
            <div class="bar-label">Pending</div>
          </div>
        `;

        // Update Progress
        document.getElementById('progressText').textContent = metrics.completion_rate + '%';
        document.getElementById('progressFill').style.width = metrics.completion_rate + '%';
        document.getElementById('completedCount').textContent = campaign.completed;
        document.getElementById('targetCount').textContent = campaign.target;

      } catch (err) {
        alert('Error loading analytics: ' + err.message);
      }
    })();
  </script>
</body>
</html>
