<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - YOLOTASK</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body>
  <div class="auth-stage">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="flip-scene">
      <div class="flip-card" id="flipCard"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/public.js"></script>
  <script>
    // Auto-route already-logged-in users
    (async () => {
      if (!localStorage.getItem('yolotask_token')) return;
      try {
        const res = await apiClient.request('auth.js', { action: 'get-session' });
        const p = res.data.profile;
        localStorage.setItem('yolotask_user', JSON.stringify(p));
        const HOME = { earner: '/earner/dashboard.html', advertiser: '/advertiser/dashboard.html', reviewer: '/reviewer/dashboard.html', admin: '/admin/dashboard.html' };
        window.location.replace(HOME[p.role] || '/login.html');
      } catch (e) { /* stay */ }
    })();

    __initFlipAuth('login', null);
  </script>
</body>
</html>
