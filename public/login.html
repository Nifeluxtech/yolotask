<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - YOLOTASK</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-logo">YOLOTASK</div>
    <h2 style="text-align:center; margin-bottom:20px;">Welcome Back</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Login</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="/register.html">Register Free</a></p>
      <p style="margin-top:10px;"><a href="/forgot-password.html">Forgot Password?</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('errorMsg');
      btn.disabled = true; btn.textContent = 'Logging in...'; errDiv.textContent = '';

      try {
        const res = await apiClient.request('auth.js', {
          action: 'login',
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });

        localStorage.setItem('yolotask_token', res.data.session.access_token);
        window.location.href = '/earner/dashboard.html'; // Redirect logic handled later by role
      } catch (err) {
        errDiv.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
